<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as cloneWithSkeleton } from 'three/addons/utils/SkeletonUtils.js';

const status=document.getElementById('raceStatus');
const retryButton=document.getElementById('retry');
const countdown=document.getElementById('countdown'), results=document.getElementById('results');
const winnerAnnouncement=document.getElementById('winnerAnnouncement');
const ranking=document.getElementById('ranking'), viewport=document.getElementById('viewport');
const votingLayout=document.getElementById('votingLayout');
const votePanel=document.getElementById('voting'),voteCards=document.getElementById('voteCards');
const voteHeading=document.getElementById('voteHeading');
const phaseMessage=document.getElementById('phaseMessage'),phaseTimer=document.getElementById('phaseTimer'),voteFeedback=document.getElementById('voteFeedback');
const votingTimerConfig={preparationSeconds:10,votingSeconds:15,closingSeconds:5};
// 正面では止まらず、左右端で自然に減速する同期した往復回転。
const votingPreviewConfig = { angleDegrees:45, swayCycleSeconds:9, settleSeconds:0.35 };
// 閉幕5秒のうち、1秒表示→2秒退場→残りはレース構図で待機。
const votingPanelExitConfig = { holdSeconds:1, slideSeconds:2 };
const votingPreview = { startedAt:0, closingHeadings:[], closingVelocity:0, voteView:null, raceView:null };
const previewEase = t => { t=THREE.MathUtils.clamp(t,0,1); return t*t*t*(t*(t*6-15)+10); };
const raceCountdownSeconds=3;
// 投票は一時状態のみ。登録済みキャラクターやlocalStorageには書き込まない。
const voting={counts:new Map(),locked:null,views:new Map(),feedbackUntil:0};
const votingRaceConfig={firstFinishSeconds:30,secondsPerRank:1.3,maxSpeedInHeights:3.2};
// 距離はモデル全高に対する倍率。中心ルートの長さは4*halfStraight+2π*curveRadius。
const trackConfig={halfStraight:3.8,curveRadius:4.8,width:6,laps:1,samples:256};
// lateralStepは初期の間隔、lateralSpeedは横移動の目安、clearanceは接近時の最低中心間隔。
const passingConfig={lateralStep:1.35,lateralSpeed:0.7,clearance:1.12};
// 1体ごとの発生確率。イベントは時間をずらして計画し、最後の6秒には発生させない。
const incidentConfig={probability:0.28,durations:{stumble:1.25,fall:2.6,roll:2.1},minGapSeconds:3};
// 減速時間、ゴール後の間、優勝者へ近づく時間、その顔を見せる時間（秒）。
const finishShowConfig={coastSeconds:2.1,pauseSeconds:1.6,zoomSeconds:2.4,revealSeconds:1.4};
const raceCameraConfig={followPerSecond:1.5,overviewSeconds:2.5};
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdceef3);
const camera=new THREE.PerspectiveCamera(40,1,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); viewport.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;
const storageKey='busakawaRace.characters.v1';
const racers=[];
const raceCamera={manual:false};
controls.addEventListener?.('start',()=>{if(race.state==='racing')raceCamera.manual=true;});
const race={state:'loading',phaseStartedAt:0,deadline:null,raceStartedAt:null,noVotes:false,elapsed:0,finishers:[],plans:new Map(),presentationStartedAt:null,winners:[],finishView:null,winnerHeadings:[]};
const course={length:12,lapLength:12,laneWidth:1.6,height:1,halfStraight:3.8,curveRadius:4.8,width:6};
const trackObjects=new THREE.Group(),backgroundObjects=new THREE.Group();
scene.add(backgroundObjects,trackObjects);
let sharedFootContacts;
const rigContactIndexCache=new WeakMap(), calibratedRigContacts=new WeakMap();
const organicContactIndexCache=new WeakMap();
const randomBetween=range=>range[0]+Math.random()*(range[1]-range[0]);
// 顔復元・ボーン複製・接地補正はpasture.htmlと同じ処理。保存データへの書き込みは行わない。
const partSettings = {
  eye_01: { path: './assets/eyes/eye_01.glb', sizeMultiplier: 0.48, fixedDepth: -0.1 },
  eye_02: { path: './assets/eyes/eye_02.glb', sizeMultiplier: 0.48, fixedDepth: -0.1 },
  mouth_01: { path: './assets/mouths/mouth_01.glb', sizeMultiplier: 0.55, fixedDepth: -0.1 },
  mouth_02: { path: './assets/mouths/mouth_02.glb', sizeMultiplier: 1.10, fixedDepth: -0.13, depthLocked: true },
  mouth_03: { path: './assets/mouths/mouth_03.glb', sizeMultiplier: 0.715, fixedDepth: -0.16, depthLocked: true }
};
const partSlots = ['eye_01', 'eye_02', 'mouth_01'];
const walkConfig = {
  speedInHeights: [0.28, 0.46],
  walkSeconds: [2.5, 6],
  idleSeconds: [1, 3.5],
  turnRadiansPerSecond: 2.1,
  rangePaddingInHeights: 2,
  groundEdgePaddingInHeights: 0.5,
  boundaryTurnInHeights: 0.9,
  avoidanceInHeights: 0.22,
  rollRadians: 0.045,
  bobInHeights: 0.015,
  strideInHeights: 0.45,
  maxDeltaSeconds: 0.05,
  hipSwingRadians: 0.34,
  kneeBendRadians: 0.45,
  footLiftInHeights: 0.025,
  rigStrideScale: 1,
  rigRollRadians: 0.018,
  rigBobInHeights: 0,
  gaitBlendPerSecond: 12,
  rigGroundClearanceInHeights: 0.0003
};
// 開発用比較: 'classic' にすると従来の走行。変更後はページを再読み込みする。
const runMotionConfig = {
  mode: 'organic',
  stride: 1.18,           // 基本歩幅。大きいほど同じ速度でゆったりした足運び
  stanceRatio: 0.60,      // 1周期の接地比率（残りが遊脚）。調整範囲0.52〜0.68
  footLift: 0.022,        // 足を持ち上げる高さ（全高に対する比率）
  hipSwing: 0.34,         // 前後の振り幅（ラジアン）
  kneeBend: 0.48,         // 遊脚時の膝の曲がり（ラジアン）
  sway: 0.025,            // 体重移動の左右傾斜（ラジアン）
  lateralShift: 0.008,    // 頭と足をまとめた左右移動（全高比、レーン内のみ）
  forwardLean: 0.035,     // 走行中の前傾（ラジアン）
  bounce: 0.004,          // 接地補正に加える小さな上下動（全高比）
  smoothSeconds: 0.10,    // 開始・停止・速度変化のなじみ時間。大きいほど柔らかい
  bodyLag: 0.32,          // 足に対する体重移動の位相遅れ（ラジアン）
  individuality: 0.65,    // IDごとの歩幅・足上げ・揺れ・左右差の強さ（0〜1）
  rhythmVariation: 0.035 // 数歩ごとの控えめな歩幅変動。毎フレームの乱数は使わない
};

function readRegisteredCharacters() {
  const raw = localStorage.getItem(storageKey);
  if (raw === null) return [];
  let data;
  try { data = JSON.parse(raw); } catch {
    throw new Error('登録データを読み取れなかったよ。保存データは変更していないよ。');
  }
  if (!data || data.schemaVersion !== 1 || !Array.isArray(data.characters) ||
      !Number.isSafeInteger(data.nextNumber) || data.nextNumber < 1) {
    throw new Error('登録データの形式を確認できなかったよ。保存データは変更していないよ。');
  }
  const ids = new Set();
  for (const record of data.characters) {
    if (!record || !Number.isSafeInteger(record.id) || record.id < 1 || ids.has(record.id) ||
        record.name !== `ぶさかわ${String(record.id).padStart(3, '0')}` ||
        !record.parts || typeof record.parts !== 'object') {
      throw new Error('登録データを確認できなかったよ。顔を作る画面へ戻って確認してね。');
    }
    ids.add(record.id);
    for (const slot of partSlots) {
      const part = record.parts[slot];
      // データにないパーツは補完しない。
      if (part === undefined) continue;
      if (!part || typeof part.exists !== 'boolean' || !Object.hasOwn(partSettings, part.type) ||
          ![part.x, part.y, part.rotation].every(Number.isFinite)) {
        throw new Error(`${record.name}の顔データを確認できなかったよ。保存データは残してあるよ。`);
      }
    }
  }
  return data.characters;
}

// GLBは種類ごとに1回だけ読み込み、個体は骨を含めて複製する。
const loader = new GLTFLoader();
const modelTemplates = new Map();
function loadTemplate(path) {
  if (!modelTemplates.has(path)) {
    modelTemplates.set(path, loader.loadAsync(path).then((gltf) => gltf.scene));
  }
  return modelTemplates.get(path);
}

// 計算は生成時だけ。制作画面と同じ座標系の中で復元してから個体全体を移動する。
function createHeadSurface(character) {
  character.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(character);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxSize = Math.max(size.x, size.y, size.z);
  const headRadius = Math.min(size.x * 0.48, size.y * 0.34);
  const headCenter = new THREE.Vector3(center.x, box.max.y - headRadius, center.z);
  const headMinY = headCenter.y - headRadius;
  const meshes = [];
  character.traverse((object) => {
    if (object.isMesh) {
      meshes.push(object);
      if (object.isSkinnedMesh) object.skeleton.update();
    }
  });
  const raycaster = new THREE.Raycaster();
  const direction = new THREE.Vector3(0, 0, -1);
  const forward = new THREE.Vector3(0, 0, 1);
  const rayHits = [];
  const intersect = () => {
    rayHits.length = 0;
    return raycaster.intersectObjects(meshes, false, rayHits);
  };

  function placement(x, y, rotation, halfWidth, halfHeight, rearDepth, fixedDepth) {
    const worldY = headCenter.y + headRadius * y;
    if (worldY < headMinY || worldY > box.max.y) return null;
    raycaster.set(new THREE.Vector3(headCenter.x + headRadius * x, worldY, box.max.z + maxSize), direction);
    raycaster.near = 0;
    raycaster.far = size.z + maxSize * 2;
    const hit = intersect().find((h) => h.face && h.point.y >= headMinY);
    if (!hit) return null;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    hit.object.getVertexPosition(hit.face.a, a).applyMatrix4(hit.object.matrixWorld);
    hit.object.getVertexPosition(hit.face.b, b).applyMatrix4(hit.object.matrixWorld);
    hit.object.getVertexPosition(hit.face.c, c).applyMatrix4(hit.object.matrixWorld);
    const normal = new THREE.Vector3().crossVectors(b.sub(a), c.sub(a));
    if (normal.lengthSq() < 1e-20) return null;
    normal.normalize();
    if (normal.dot(direction) > 0) normal.negate();
    const orientation = new THREE.Quaternion().setFromUnitVectors(forward, normal);
    const sampleDirection = normal.clone().negate();
    const sampleOffset = new THREE.Vector3(), sampleOrigin = new THREE.Vector3();
    const riseVector = new THREE.Vector3();
    let surfaceRise = 0;
    // 回転を入れる前の9点補正。制作画面と同じく、角度で取り付け位置はずれない。
    for (let ix = -1; ix <= 1; ix++) {
      for (let iy = -1; iy <= 1; iy++) {
        sampleOffset.set(ix * halfWidth, iy * halfHeight, 0).applyQuaternion(orientation);
        sampleOrigin.copy(hit.point).add(sampleOffset).addScaledVector(normal, maxSize);
        raycaster.set(sampleOrigin, sampleDirection);
        raycaster.near = 0;
        raycaster.far = maxSize * 2;
        const sampleHit = intersect().find((h) => h.point.y >= headMinY);
        if (sampleHit) surfaceRise = Math.max(surfaceRise, riseVector.subVectors(sampleHit.point, hit.point).dot(normal));
      }
    }
    const normalizedRotation = rotation >= -180 && rotation <= 180
      ? rotation : ((rotation % 360 + 540) % 360) - 180;
    const offset = rearDepth + surfaceRise + maxSize * 0.001 + headRadius * fixedDepth;
    return {
      position: hit.point.clone().addScaledVector(normal, offset),
      quaternion: orientation.multiply(new THREE.Quaternion().setFromAxisAngle(forward, THREE.MathUtils.degToRad(normalizedRotation)))
    };
  }
  return { box, center, size, maxSize, headRadius, placement };
}

function restorePart(template, saved, surface) {
  const settings = partSettings[saved.type];
  const part = cloneWithSkeleton(template);
  const originalSize = new THREE.Box3().setFromObject(part).getSize(new THREE.Vector3());
  const maxPartSize = Math.max(originalSize.x, originalSize.y, originalSize.z);
  if (maxPartSize <= 0) throw new Error(`${saved.type}の大きさを取得できなかったよ。`);
  part.scale.multiplyScalar(surface.headRadius * settings.sizeMultiplier / maxPartSize);
  const scaledBox = new THREE.Box3().setFromObject(part);
  const scaledSize = scaledBox.getSize(new THREE.Vector3());
  part.position.sub(scaledBox.getCenter(new THREE.Vector3()));
  const group = new THREE.Group();
  group.name = saved.type;
  group.add(part);
  group.updateMatrixWorld(true);
  const rearDepth = Math.max(0, -new THREE.Box3().setFromObject(group).min.z);
  const pose = surface.placement(saved.x, saved.y, saved.rotation,
    scaledSize.x * 0.5, scaledSize.y * 0.5, rearDepth, settings.depthLocked ? settings.fixedDepth : (Number.isFinite(saved.depth) ? saved.depth : settings.fixedDepth));
  if (!pose) throw new Error(`${saved.type}の保存位置に頭の表面が見つからなかったよ。`);
  group.position.copy(pose.position);
  group.quaternion.copy(pose.quaternion);
  return group;
}

function makeNameLabel(name, maxSize) {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 160;
  const context = canvas.getContext('2d');
  context.fillStyle = 'rgba(255,255,255,0.6)';
  context.beginPath();
  context.roundRect(14, 12, 612, 136, 46);
  context.fill();
  context.fillStyle = '#304734';
  context.font = 'bold 52px sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(name, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
  label.scale.set(maxSize * 1.55, maxSize * 0.39, 1);
  label.name = 'registrationLabel';
  label.visible = false;
  return label;
}

function createRaceCharacter(record, templates) {
  const group = new THREE.Group();
  group.name = record.name;
  // modelSpace内では制作時の座標系を維持する。
  const modelSpace = new THREE.Group();
  const character = cloneWithSkeleton(templates.character);
  modelSpace.add(character);
  const surface = createHeadSurface(character);
  const legRig = createLegRig(character, surface);
  const parts = new Map();
  for (const slot of partSlots) {
    const saved = record.parts[slot];
    if (!saved || saved.exists !== true) continue;
    const partGroup = restorePart(templates.parts.get(saved.type), saved, surface);
    parts.set(slot, partGroup);
    modelSpace.add(partGroup);
  }
  // 頭足人と顔をまとめて足元を地面に、左右の中心を原点に揃える。
  modelSpace.position.set(-surface.center.x, -surface.box.min.y, -surface.center.z);
  // 移動・向きはgroup、よちよちした傾きはwalkPivotに分ける。
  // 顔と体は同じwalkPivot内、番号はその外なので文字は揺れない。
  const walkPivot = new THREE.Group();
  walkPivot.add(modelSpace);
  group.add(walkPivot);
  if (!sharedFootContacts) sharedFootContacts = collectFootContacts(character, surface);
  const label = makeNameLabel(record.name, surface.maxSize);
  label.position.set(0, surface.size.y + surface.maxSize * 0.3, 0);
  label.scale.x*=.8;group.add(label);
  const radius = Math.hypot(surface.size.x, surface.size.z) * 0.53;
  return { id: record.id, name: record.name, group, walkPivot, modelSpace,
    character, parts, surface, label, radius, legRig,
    behavior: {
      mode: 'free', state: 'idle', remaining: Math.random() * 1.8 + 0.2,
      heading: Math.random() * Math.PI * 2,
      speed: surface.maxSize * randomBetween(walkConfig.speedInHeights),
      phase: Math.random() * Math.PI * 2, weight: 0, neighbors: []
    }
  };
}

function createLegRig(character, surface) {
  const bones = new Map();
  const meshes = [];
  character.traverse((object) => {
    if (object.isBone) bones.set(object.name.replace(/[._\s-]/g, ''), object);
    if (object.isSkinnedMesh) meshes.push(object);
  });
  const legs = [];
  let reach = 0;
  for (const side of ['L', 'R']) {
    const hip = bones.get(`Leg${side}`), knee = bones.get(`Leg2${side}`), foot = bones.get(`Foot${side}`);
    if (!hip || !knee || !foot || knee.parent !== hip || foot.parent !== knee) return null;
    const makeJoint = (bone) => ({
      bone,
      rest: bone.quaternion.clone(),
      delta: new THREE.Quaternion(),
      // Blender由来のボーンのローカル軸に依存せず、モデルの左右軸で前後に振る。
      axis: new THREE.Vector3(1, 0, 0).applyQuaternion(bone.getWorldQuaternion(new THREE.Quaternion()).invert())
    });
    reach += Math.abs(hip.getWorldPosition(new THREE.Vector3()).y - foot.getWorldPosition(new THREE.Vector3()).y);
    legs.push({ side, hip: makeJoint(hip), knee: makeJoint(knee), foot: makeJoint(foot),
      restPosition: hip.position.clone(),
      up: new THREE.Vector3(0, 1, 0).applyQuaternion(hip.parent.getWorldQuaternion(new THREE.Quaternion()).invert()) });
  }
  if (!meshes.length) return null;
  const contacts = [];
  const vertex = new THREE.Vector3();
  for (const mesh of meshes) {
    let cached = rigContactIndexCache.get(mesh.geometry);
    if (!cached) {
      cached = [];
      const organicIndices = new Set();
      const indices = mesh.geometry.attributes.skinIndex;
      const weights = mesh.geometry.attributes.skinWeight;
      if (!indices || !weights) return null;
      for (const leg of legs) {
        const footIndex = mesh.skeleton.bones.indexOf(leg.foot.bone);
        const points = [];
        for (let i = 0; i < indices.count; i++) {
          let footWeight = 0;
          for (let k = 0; k < 4; k++) if (indices.getComponent(i, k) === footIndex) footWeight += weights.getComponent(i, k);
          if (footWeight < 0.5) continue;
          mesh.getVertexPosition(i, vertex).applyMatrix4(mesh.matrixWorld);
          if (vertex.y <= surface.box.min.y + surface.maxSize * 0.07) points.push({ x: vertex.x, y: vertex.y, index: i, blended: footWeight < 0.99999 });
        }
        for(const point of points)organicIndices.add(point.index);
        // 足首の逆回転で足裏の向きが保たれるため、足裏のXY凸包が接地判定に使える。
        points.sort((a, b) => a.x - b.x || a.y - b.y);
        const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
        const lower = [], upper = [];
        for (const point of points) {
          while (lower.length > 1 && cross(lower.at(-2), lower.at(-1), point) <= 0) lower.pop();
          lower.push(point);
        }
        for (let i = points.length - 1; i >= 0; i--) {
          const point = points[i];
          while (upper.length > 1 && cross(upper.at(-2), upper.at(-1), point) <= 0) upper.pop();
          upper.push(point);
        }
        if (points.length < 2) return null;
        lower.pop(); upper.pop();
        // 混合ウェイトの頂点は骨の逆回転でも変形するため、凸包から省かない。
        const sampleIndices = new Set(lower.concat(upper).map((point) => point.index));
        for (const point of points) if (point.blended) sampleIndices.add(point.index);
        for (const index of sampleIndices) cached.push(index);
      }
      rigContactIndexCache.set(mesh.geometry, cached);
      organicContactIndexCache.set(mesh.geometry,[...organicIndices]);
    }
    const selected = calibratedRigContacts.get(mesh.geometry) || cached;
    for (const index of selected) contacts.push({ mesh, index });
  }
  // 1周期の前後ストロークと実際の移動距離を揃え、足滑りを抑える。
  const strideLength = reach * 0.5 * 4 * Math.sin(walkConfig.hipSwingRadians) * walkConfig.rigStrideScale;
  if (!contacts.length || strideLength <= 0) return null;
  const rig = { legs, meshes, contacts, vertex, strideLength };
  if (contacts.length > 160) calibrateRigContactSamples(character, rig, surface);
  // 新しい足運びと前傾では旧周期用の8点だけでは足りない。
  // 生成時に取得済みの足裏候補（前後傾斜も扱うためXY凸包には絞らない）を再利用し、Raycasterや全身の再走査は行わない。
  rig.organicContacts=[];
  for(const mesh of meshes)for(const index of organicContactIndexCache.get(mesh.geometry))rig.organicContacts.push({mesh,index});
  return rig;
}

function applyLegPose(rig, phase, weight, maxSize) {
  for (let i = 0; i < rig.legs.length; i++) {
    const leg = rig.legs[i];
    const legPhase = phase + i * Math.PI;
    const swing = Math.max(0, Math.cos(legPhase));
    const hip = -Math.sin(legPhase) * walkConfig.hipSwingRadians * weight;
    const knee = swing * swing * walkConfig.kneeBendRadians * weight;
    setJointAngle(leg.hip, hip);
    setJointAngle(leg.knee, knee);
    setJointAngle(leg.foot, -hip - knee);
    leg.hip.bone.position.copy(leg.restPosition).addScaledVector(leg.up,
      swing * swing * maxSize * walkConfig.footLiftInHeights * weight);
  }
}

function setJointAngle(joint, angle) {
  joint.delta.setFromAxisAngle(joint.axis, angle);
  joint.bone.quaternion.copy(joint.rest).multiply(joint.delta);
}

function calibrateRigContactSamples(character, rig, surface) {
  // 混合ウェイトの候補から歩行1周期・複数のブレンド量で最下点になる頂点を選ぶ。
  // GLBの種類ごとに初回だけ行い、各個体は同じ頂点番号と独立した骨を使う。
  const selected = new Set();
  for (const weight of [0, 0.25, 0.5, 0.75, 1]) {
    for (let sample = 0; sample < 64; sample++) {
      const phase = sample / 64 * Math.PI * 2;
      applyLegPose(rig, phase, weight, surface.maxSize);
      character.updateMatrixWorld(true);
      for (const mesh of rig.meshes) mesh.skeleton.update();
      const roll = Math.sin(phase) * walkConfig.rigRollRadians * weight;
      const sin = Math.sin(roll), cos = Math.cos(roll);
      let minimum = Infinity, lowest;
      for (const contact of rig.contacts) {
        contact.mesh.getVertexPosition(contact.index, rig.vertex).applyMatrix4(contact.mesh.matrixWorld);
        const y = (rig.vertex.x - surface.center.x) * sin + (rig.vertex.y - surface.box.min.y) * cos;
        if (y < minimum) { minimum = y; lowest = contact; }
      }
      if (lowest) selected.add(lowest);
    }
  }
  applyLegPose(rig, 0, 0, surface.maxSize);
  character.updateMatrixWorld(true);
  for (const mesh of rig.meshes) mesh.skeleton.update();
  rig.contacts = [...selected];
  for (const mesh of rig.meshes) {
    calibratedRigContacts.set(mesh.geometry, rig.contacts.filter((c) => c.mesh === mesh).map((c) => c.index));
  }
}

function rigGroundHeight(item) {
  // 脚の新しい姿勢を反映して、少数の足裏頂点だけをスキニングする。
  // 体と顔の親グループを一緒に補正し、頭の骨Bodyには手を加えない。
  item.walkPivot.position.y = 0;
  item.group.updateMatrixWorld(true);
  const rig = item.legRig;
  for (const mesh of rig.meshes) mesh.skeleton.update();
  let footY = Infinity;
  const contacts=runMotionConfig.mode==='organic' ? rig.organicContacts : rig.contacts;
  for (const contact of contacts) {
    contact.mesh.getVertexPosition(contact.index, rig.vertex).applyMatrix4(contact.mesh.matrixWorld);
    footY = Math.min(footY, rig.vertex.y);
  }
  return Number.isFinite(footY) ? -footY + item.surface.maxSize * walkConfig.rigGroundClearanceInHeights : 0;
}

// 足付近の頂点を初回だけ調べ、XY平面の凸包に絞る。
// 傾きによる最下点を少数の接地点だけで計算でき、毎フレームのBox3/Raycasterは不要。
function collectFootContacts(character, surface) {
  const points = [];
  const vertex = new THREE.Vector3();
  character.traverse((mesh) => {
    if (!mesh.isMesh) return;
    for (let i = 0; i < mesh.geometry.attributes.position.count; i++) {
      mesh.getVertexPosition(i, vertex).applyMatrix4(mesh.matrixWorld);
      if (vertex.y <= surface.box.min.y + surface.maxSize * 0.2) {
        points.push({ x: vertex.x - surface.center.x, y: vertex.y - surface.box.min.y });
      }
    }
  });
  points.sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  const lower = [], upper = [];
  for (const point of points) {
    while (lower.length > 1 && cross(lower.at(-2), lower.at(-1), point) <= 0) lower.pop();
    lower.push(point);
  }
  for (let i = points.length - 1; i >= 0; i--) {
    const point = points[i];
    while (upper.length > 1 && cross(upper.at(-2), upper.at(-1), point) <= 0) upper.pop();
    upper.push(point);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function updateClassicWalkVisual(item, distance, dt) {
  const state = item.behavior;
  const stride = item.legRig?.strideLength || item.surface.maxSize * walkConfig.strideInHeights;
  if (distance > 0) state.phase = (state.phase + distance / stride * Math.PI * 2) % (Math.PI * 2);
  const blend = 1 - Math.exp(-walkConfig.gaitBlendPerSecond * dt);
  state.weight += ((distance > 0 ? 1 : 0) - state.weight) * blend;
  if (state.weight < 0.001) state.weight = 0;
  const rollAmount = item.legRig ? walkConfig.rigRollRadians : walkConfig.rollRadians;
  const bobAmount = item.legRig ? walkConfig.rigBobInHeights : walkConfig.bobInHeights;
  const roll = Math.sin(state.phase) * rollAmount * state.weight;
  item.walkPivot.rotation.z = roll;
  let groundHeight;
  if (item.legRig) {
    applyLegPose(item.legRig, state.phase, state.weight, item.surface.maxSize);
    groundHeight = rigGroundHeight(item);
  } else {
    // 対応するリグがないモデルでは従来の全体揺れを維持する。
    let footY = Infinity;
    const sin = Math.sin(roll), cos = Math.cos(roll);
    for (const point of sharedFootContacts) footY = Math.min(footY, point.x * sin + point.y * cos);
    groundHeight = Number.isFinite(footY) ? -footY : 0;
  }
  const bob = (1 - Math.cos(state.phase * 2)) * 0.5 * item.surface.maxSize * bobAmount * state.weight;
  item.walkPivot.position.y = groundHeight + bob;
}


// 参考: Three.jsの重みブレンド/時間制御、procedural-spiderの接地/遊脚の分離。
// クリップのない短足リグへ合わせた独自のプロシージャル制御。外部モーションは使わない。
const motionEase = t => t*t*t*(t*(t*6-15)+10); // 端で速度・加速度が0になる五次補間
function motionBump(u) {
  // 素早く持ち上げ、少し長くかけて下ろす。頂点でも滑らかにつながる。
  return u<.42 ? motionEase(u/.42) : 1-motionEase((u-.42)/.58);
}
function resetRunMotion(item) {
  const feature=salt=>{
    const value=Math.sin(item.id*12.9898+salt*78.233)*43758.5453;
    return (value-Math.floor(value))*2-1;
  };
  const amount=THREE.MathUtils.clamp(runMotionConfig.individuality,0,1);
  item.runMotion={
    profile:{stride:1+feature(1)*.16*amount,lift:1+feature(2)*.24*amount,
      sway:1+feature(3)*.30*amount,bounce:1+feature(4)*.30*amount,
      asymmetry:feature(5)*.045*amount,offset:feature(6)*Math.PI*amount},
    phase:item.behavior.phase, speed:0, roll:0, pitch:0, shift:0, bob:0
  };
  item.walkPivot.rotation.set(0,0,0);item.walkPivot.position.set(0,0,0);
}
function applyOrganicLegPose(item,weight) {
  const motion=item.runMotion,config=runMotionConfig,profile=motion.profile;
  const speedRatio=THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*.9),0,1.6);
  const effort=.78+.22*speedRatio;
  for(let i=0;i<item.legRig.legs.length;i++) {
    const leg=item.legRig.legs[i],side=i===0?1:-1;
    const cycle=((motion.phase/(Math.PI*2)+i*.5)%1+1)%1;
    const stance=THREE.MathUtils.clamp(config.stanceRatio+side*profile.asymmetry*.2,.52,.68);
    let hip,knee,lift,toe;
    const amplitude=config.hipSwing*effort*THREE.MathUtils.clamp(config.stride*profile.stride,.65,1.4)*(1+side*profile.asymmetry);
    if(cycle<stance) {
      const u=cycle/stance;
      // 足を前に置き、接地して後ろへ押す。接地の出入りは連続した速度でつなぐ。
      const push=u-Math.sin(u*Math.PI*2)/(Math.PI*2);
      hip=amplitude*(push*2-1);
      knee=.025*Math.sin(Math.PI*u)**2;
      lift=0;
      toe=u>.65 ? .055*motionBump((u-.65)/.35) : 0;
    } else {
      const u=(cycle-stance)/(1-stance),arc=motionBump(u);
      hip=amplitude*(1-2*motionEase(u));
      knee=config.kneeBend*arc*effort;
      lift=item.surface.maxSize*config.footLift*profile.lift*arc;
      toe=.045*Math.sin(u*Math.PI*2)*Math.sin(u*Math.PI)**2;
    }
    setJointAngle(leg.hip,hip*weight);setJointAngle(leg.knee,knee*weight);
    setJointAngle(leg.foot,(-hip-knee+toe)*weight);
    leg.hip.bone.position.copy(leg.restPosition).addScaledVector(leg.up,lift*weight);
  }
}
function updateWalkVisual(item,distance,dt) {
  if(runMotionConfig.mode==='classic' || !item.legRig) {
    updateClassicWalkVisual(item,distance,dt);return;
  }
  if(!item.runMotion)resetRunMotion(item);
  const motion=item.runMotion,profile=motion.profile,config=runMotionConfig,state=item.behavior;
  const smoothing=Math.max(.025,config.smoothSeconds);
  const blend=1-Math.exp(-dt/smoothing);
  const measuredSpeed=dt>0 ? distance/dt : 0;
  motion.speed+=(measuredSpeed-motion.speed)*blend;
  state.weight+=((distance>0?1:0)-state.weight)*blend;
  if(distance===0 && state.weight<.001) { state.weight=0;motion.speed=0; }
  // 位相は積算し続ける。速度や歩幅が変わっても現在の足の姿勢を飛ばさない。
  const breathing=1+config.rhythmVariation*Math.sin(motion.phase*.23+profile.offset);
  // 高速域では歩幅も少し伸ばし、足だけが極端な高速回転にならないようにする。
  const speedStride=1+.35*THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*.9)-1,0,1.8);
  const contactRatio=THREE.MathUtils.clamp(config.stanceRatio,.52,.68);
  // 接地を長くした分は1周期の距離を短くし、足が地面を押す速度と前進を近づける。
  const stride=item.legRig.strideLength*Math.max(.6,config.stride)*profile.stride*breathing*speedStride*(.5/contactRatio);
  motion.phase+=motion.speed*dt/stride*Math.PI*2;
  state.phase=motion.phase;
  applyOrganicLegPose(item,state.weight);
  const lagPhase=motion.phase-config.bodyLag;
  const effort=THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*.9),0,1.4);
  const roll=-Math.cos(lagPhase)*config.sway*profile.sway*state.weight;
  const pitch=(config.forwardLean*effort+.008*Math.sin(lagPhase*2))*state.weight;
  const shift=Math.cos(lagPhase)*config.lateralShift*item.surface.maxSize*profile.sway*state.weight;
  const bob=(.5-.5*Math.cos(lagPhase*2))*config.bounce*item.surface.maxSize*profile.bounce*state.weight;
  // 大きな頭は足の切替へ少し遅れて追従。Bodyボーンは動かさず、顔ごと親を動かす。
  motion.roll+=(roll-motion.roll)*blend;motion.pitch+=(pitch-motion.pitch)*blend;
  motion.shift+=(shift-motion.shift)*blend;motion.bob+=(bob-motion.bob)*blend;
  if(state.weight===0) { motion.roll=0;motion.pitch=0;motion.shift=0;motion.bob=0; }
  item.walkPivot.rotation.set(motion.pitch,0,motion.roll);
  item.walkPivot.position.x=motion.shift;
  item.walkPivot.position.y=rigGroundHeight(item)+motion.bob;
}

// 牧場と同じ上限・キー。出走順は選択順（レーン順）を維持する。
const entrantSelectionConfig = { maxEntrants: 4, storageKey: 'busakawaRace.entrants.v1' };
function readSelectedEntrantIds() {
  try {
    const raw = sessionStorage.getItem(entrantSelectionConfig.storageKey);
    if (raw === null) return null; // 直接アクセスは従来の登録番号順。
    const data = JSON.parse(raw);
    if (!data || data.schemaVersion !== 1 || !Array.isArray(data.ids) ||
        !data.ids.every(id => Number.isSafeInteger(id) && id > 0)) return null;
    return [...new Set(data.ids)].slice(0,entrantSelectionConfig.maxEntrants);
  } catch { return null; } // 不正データ・保存制限でも直接アクセスとして動作。
}
function selectRaceEntrants(records, selectedIds=null) {
  const byId = new Map(records.map(record=>[record.id,record]));
  // []や削除済みIDしかない指定を、勝手に別の子で補完しない。
  const eligible=selectedIds !== null ? selectedIds.map(id=>byId.get(id)).filter(Boolean) : [...records].sort((a,b)=>a.id-b.id);
  return [...new Map(eligible.map(record=>[record.id,record])).values()].slice(0,entrantSelectionConfig.maxEntrants);
}
// 集計・同順位判定は描画や走行から独立。競技順位（1位、1位、3位…）を使う。
function tallyVotes(entrants,counts) {
  const ordered=entrants.map(item=>({id:item.id,name:item.name,votes:counts.get(item.id)||0}))
    .sort((a,b)=>b.votes-a.votes||a.id-b.id);
  return ordered.map((item,index)=>({...item,rank:index>0&&item.votes===ordered[index-1].votes
    ? ordered.findIndex(other=>other.votes===item.votes)+1 : index+1}));
}
function castVote(id,now=performance.now()) {
  // 描画が止まっていても、クリック時点で締切を検査してから受理する。
  syncFlow(now);
  updateVotingPanelLayout(now);
  updateVotingPreview(now);
  if(race.state!=='voting'||now>=race.deadline||!voting.counts.has(id))return;
  voting.counts.set(id,voting.counts.get(id)+1);
  voting.feedbackUntil=now+900;renderFlow(now);
}
function refreshVoting() {
  const open=race.state==='voting';
  for(const view of voting.views.values())view.button.disabled=!open;
}
function createVotingCards() {
  voteCards.replaceChildren();voting.views.clear();
  for(const item of racers) {
    const row=document.createElement('div');row.className='voteCard';
    const name=document.createElement('span');name.textContent=item.name;
    const button=document.createElement('button');button.type='button';button.textContent='ぶさかわ！';
    button.setAttribute('aria-label',`${item.name}にぶさかわ！`);
    button.addEventListener('click',()=>castVote(item.id));
    row.appendChild(name);row.appendChild(button);voteCards.appendChild(row);
    voting.views.set(item.id,{button});
  }
  refreshVoting();
}
// 時間と投票状態を表示から分離。後で別画面へ渡す場合も、結果前の票数は公開しない。
function getFlowSnapshot(now=performance.now()) {
  return {phase:race.state,remainingSeconds:race.deadline===null?null:Math.max(0,Math.ceil((race.deadline-now)/1000)),
    canVote:race.state==='voting'&&now<race.deadline,noVotes:race.noVotes};
}
function setFlowText(element,text) { if(element.textContent!==text)element.textContent=text; }
function renderFlow(now) {
  const flow=getFlowSnapshot(now),left=flow.remainingSeconds;
  const messages={
    preparation:['まもなく投票開始！','出走キャラクターを見比べてね。',`投票開始まで あと${left}秒`],
    voting:['投票受付中！','一番ぶさかわだと思う子に投票しよう！',`投票終了まで あと${left}秒`],
    closed:race.noVotes?['投票がありませんでした','もう一度投票してください。「もう一度」で準備から再開できます。','']
      :['投票終了！','まもなくレースが始まります！',`レース開始まで あと${left}秒`]
  };
  if(messages[flow.phase]) {
    const [title,message,timer]=messages[flow.phase];
    setFlowText(voteHeading,title);setFlowText(phaseMessage,message);setFlowText(phaseTimer,timer);
    setFlowText(status,title);
  }
  setFlowText(voteFeedback,flow.canVote&&now<voting.feedbackUntil?'投票を受け付けました':'');
  if(flow.phase==='countdown')setFlowText(countdown,String(Math.max(1,left)));
  else if(flow.phase==='racing')setFlowText(countdown,now-race.raceStartedAt<800?'GO！':'');
  else setFlowText(countdown,'');
}
function enterPhase(phase,at) {
  race.state=phase;race.phaseStartedAt=at;
  const seconds={preparation:votingTimerConfig.preparationSeconds,voting:votingTimerConfig.votingSeconds,
    closed:votingTimerConfig.closingSeconds,countdown:raceCountdownSeconds}[phase];
  race.deadline=seconds===undefined?null:at+seconds*1000;
  voting.feedbackUntil=0;
  if(phase==='preparation') {
    votingPreview.startedAt=at;
    votingLayout.style.height=''; votePanel.style.transform=''; votePanel.style.opacity='';
    votePanel.style.pointerEvents=''; votingLayout.setAttribute('aria-hidden','false');
  }
  if(phase==='closed') {
    // 締切の正確な時刻の姿勢から戻す。描画が止まっていても進行時計と一致する。
    votingPreview.closingHeadings=racers.map(item=>votingPreviewHeading(item,at));
    votingPreview.closingVelocity=votingPreviewVelocity(at);
    race.noVotes=![...voting.counts.values()].some(count=>count>0);
    if(race.noVotes)race.deadline=null;
    else {
      voting.locked=Object.freeze(tallyVotes(racers,voting.counts).map(item=>Object.freeze(item)));
      race.plans=createRacePlans(voting.locked);
    }
  }
  if(phase==='racing') { race.raceStartedAt=at;race.elapsed=0;status.textContent='レース中！'; }
  if(phase==='countdown'||phase==='racing') for(const item of racers)item.group.rotation.y=trackPose(0).heading;
  if(phase==='countdown')status.textContent='レース開始！位置について…';
  votePanel.hidden=!['preparation','voting','closed'].includes(phase);
  votingLayout.hidden=votePanel.hidden;
  retryButton.disabled=!(phase==='result'||(phase==='closed'&&race.noVotes));
  refreshVoting();renderFlow(at);resize();
}
function syncFlow(now=performance.now()) {
  // 締切から次の締切を作る。非表示から戻った場合も、遅れを加算せず一度ずつ遷移する。
  while(race.deadline!==null&&now>=race.deadline) {
    const at=race.deadline;
    switch(race.state) {
      case 'preparation':enterPhase('voting',at);break;
      case 'voting':enterPhase('closed',at);break;
      case 'closed':enterPhase('countdown',at);break;
      case 'countdown':enterPhase('racing',at);break;
      default:race.deadline=null;
    }

  renderFlow(now);
}
// 順位から目標到達時刻を作る。同票には完全に同じ時刻を割り当てる。
// 今後の演出はこの制約を保つペース曲線として追加できる。集計や投票値は変更しない。
function createRacePlans(standings,random=Math.random) {
  const plans=new Map(standings.map(item=>[item.id,{
    targetTime:votingRaceConfig.firstFinishSeconds+(item.rank-1)*votingRaceConfig.secondsPerRank,
    pulse:.34+random()*.12,phase:random()*Math.PI*2,
    lateral:{amplitude:0,period:12,phase:0}

  // 発生時刻を先に決め、待ち時間を織り込んだ速度曲線を正規化する。
  let lastEnd=-Infinity;
  const candidates=[...racers];
  for(let i=candidates.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}
  for(const item of candidates) {
    const plan=plans.get(item.id);
    if(random()>=incidentConfig.probability)continue;
    const kind=['stumble','fall','roll'][Math.min(2,Math.floor(random()*3))];
    const duration=incidentConfig.durations[kind];
    const start=Math.max(6+random()*10,lastEnd+incidentConfig.minGapSeconds);
    if(start+duration>plan.targetTime-6)continue;

  const allowance=Math.max(0,...[...plans.values()].map(plan=>plan.event?.duration??0))*.7;
  for(const plan of plans.values()){plan.targetTime+=allowance;buildRaceTimeline(plan);}
  // 上限を超える計画は全員の時間軸ごと伸ばす。イベントも伸ばし、無理な追い上げを強行しない。
  const peak=Math.max(...[...plans.values()].map(plan=>plan.timeline.speeds.reduce((maximum,value)=>Math.max(maximum,value),0)*course.length/plan.timeline.area));
  const limit=course.height*votingRaceConfig.maxSpeedInHeights;
  if(peak>limit) {

    for(const plan of plans.values()) {
      plan.targetTime*=stretch;

function lateralAt(item,plan,time) {

}
function updateFinishShow(now) {
  const elapsed=Math.max(0,(now-race.presentationStartedAt)/1000);
  if(elapsed<finishShowConfig.pauseSeconds) {countdown.textContent='ゴール！';return;}
  countdown.textContent='';winnerAnnouncement.hidden=false;
  winnerAnnouncement.textContent=(race.winners.length>1?'みんなが今回のぶさかわNo.1！':'今回のぶさかわNo.1！')+'\n'+race.winners.map(item=>item.name).join('・');
  const h=course.height,box=new THREE.Box3();
  for(const item of race.winners) {
    const p=item.group.position;box.expandByPoint(new THREE.Vector3(p.x-h*.7,h*.03,p.z-h*.7));box.expandByPoint(new THREE.Vector3(p.x+h*.7,h*1.4,p.z+h*.7));
  }
  const view=cameraViewForBox(box,box.getCenter(new THREE.Vector3()),new THREE.Vector3(1,.14,.18).normalize(),camera.aspect,course.height*2.3);
  const blend=previewEase((elapsed-finishShowConfig.pauseSeconds)/finishShowConfig.zoomSeconds);
  applyPreviewCamera(race.finishView,view,blend);
  race.winners.forEach((item,i)=>{
    const from=race.winnerHeadings[i],target=Math.atan2(view.position.x-item.group.position.x,view.position.z-item.group.position.z);
    item.group.rotation.y=from+Math.atan2(Math.sin(target-from),Math.cos(target-from))*blend;
  });
  if(elapsed>=finishShowConfig.pauseSeconds+finishShowConfig.zoomSeconds+finishShowConfig.revealSeconds)showResults(now);
}
function updateRace(now=performance.now(),visualDt=0) {
  syncFlow(now);updateVotingPanelLayout(now);updateVotingPreview(now);
  if(race.state==='racing'||race.state==='finishing') {
    const elapsed=Math.max(0,(now-race.raceStartedAt)/1000),span=Math.max(0,elapsed-race.elapsed);
    for(const item of racers)updateRunnerMotion(item,elapsed,span,visualDt);
    race.elapsed=elapsed;
    if(race.state==='racing'&&race.finishers.length===racers.length) {
      const at=race.raceStartedAt+Math.max(...race.finishers.map(item=>item.finishTime))*1000;
      beginFinishShow(at);
    }
    if(race.state==='finishing')updateFinishShow(now);
    else updateRaceCamera(now,visualDt);
  } else if(race.state==='result') {
    for(const item of racers)updateWalkVisual(item,0,visualDt);
  }
}
retryButton.addEventListener('click',()=>{
  if(race.state==='result'||(race.state==='closed'&&race.noVotes))resetRace();
});
// 進行管理はこの1本。フェーズごとのsetInterval/setTimeoutは作らない。
function resumeFlow() { updateRace(performance.now(),0); }
document.addEventListener('visibilitychange',resumeFlow);
window.addEventListener('pageshow',resumeFlow);
async function populateRace() {
  try {
    const selectedIds=readSelectedEntrantIds();
    const records=selectRaceEntrants(readRegisteredCharacters(),selectedIds);
    if(!records.length) {
      race.state='empty';buildCourse(1);
      status.textContent=selectedIds !== null
        ? '選択された出走者が見つからなかったよ。「牧場に戻る」から選び直してね。'
        : 'まだ出走できる子がいないよ。「牧場に戻る」から顔を作って登録してね。';return;
    }
    const required=new Set(records.flatMap(record=>partSlots.filter(slot=>record.parts[slot]?.exists===true).map(slot=>record.parts[slot].type)));
    const character=await loadTemplate('./assets/characters/tousokujin.glb');
    const parts=new Map(await Promise.all([...required].map(async type=>[type,await loadTemplate(partSettings[type].path)])));
    for(const [lane,record] of records.entries()) {
      const item=createRaceCharacter(record,{character,parts});
      item.lane=lane;item.raceSpeed=0;item.finishTime=null;
      createIncidentRig(item);racers.push(item);scene.add(item.group);
    }
    buildCourse(Math.max(...racers.map(item=>item.surface.maxSize)));resetRace();
  } catch(error) {
    race.state='error';race.deadline=null;retryButton.disabled=true;
    status.textContent=`レースを準備できなかったよ。${error.message}`;console.error(error);
  }
}
function resize() {
  const width=Math.max(1,viewport.clientWidth),height=Math.max(1,viewport.clientHeight);
  renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix();
  frameCourse();
}
window.addEventListener('resize',resize);resize();
let lastFrameTime;
function animate(now) {
  requestAnimationFrame(animate);
  const dt=lastFrameTime===undefined||now===undefined?0:Math.min(walkConfig.maxDeltaSeconds,Math.max(0,(now-lastFrameTime)/1000));
  lastFrameTime=now;updateRace(performance.now(),dt);controls.update();renderer.render(scene,camera);
}
animate();populateRace();
</script>
