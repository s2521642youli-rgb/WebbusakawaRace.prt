<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぶさかわ牧場</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; color: #304734; background: #dceef3; }
    canvas { display: block; }
    #pasturePanel { position: absolute; top: 20px; left: 20px; z-index: 10;
      max-width: min(340px, calc(100vw - 80px)); max-height: calc(100vh - 76px); overflow-y:auto; padding: 18px 22px;
      border-radius: 14px; background: rgba(255,255,255,.94); box-shadow: 0 4px 20px #30473416; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    #pastureStatus { line-height: 1.6; margin: 0 0 14px; }
    a { display: inline-block; padding: 10px 16px; border-radius: 8px;
      background: #ffdf83; color: #304734; text-decoration: none; font-weight: bold; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; color: #304734; background: #bfe2bd; font: inherit; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #resetCharacters { background: #e9a6a6; }
    #entrantList { padding-left:0; list-style:none; line-height:1.7; margin:8px 0; }
    #selectionMode[aria-pressed="true"] { background:#ffdf83; outline:2px solid #bc9027; }
    #launchRace { background:#ffdf83; }
    .hint { margin: 12px 0 0; font-size: 12px; color: #617465; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="pasturePanel">
    <h1>ぶさかわ牧場</h1>
    <p id="pastureStatus" role="status">牧場を準備しているよ…</p>
    <a href="./index.html">顔を作る</a>
    <section aria-label="レースの出走者">
      <div class="actions"><button id="selectionMode" type="button" aria-pressed="false" disabled>出走者を選ぶ</button></div>
      <p id="selectionStatus" role="status">出走者を読み込み中…</p>
      <ul id="entrantList" aria-label="選択中の出走者"></ul>
      <div class="actions">
        <button id="randomEntrants" type="button" disabled>空きをランダムで埋める</button>
        <button id="clearEntrants" type="button" disabled>選択をすべて解除</button>
        <button id="launchRace" type="button" disabled>この子たちでレースへ！</button>
      </div>
    </section>
    <div class="actions">
      <button id="gather" type="button" disabled>集合！</button>
      <button id="dismiss" type="button" disabled>解散！</button>
      <button id="resetCharacters" type="button">登録データをリセット</button>
    </div>
    <p class="hint">クリックで名前を表示・地面をクリックで閉じる<br>ドラッグで見回す・スクロールで拡大縮小</p>
  </div>
  <script type="module">
import {partSettings,partSlots} from './js/parts-config.js';
import {createModelCache} from './js/model-cache.js';
import {readPartAdjustment,adjustedPartBounds,applyPartAdjustment} from './js/part-adjustment.js';
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as cloneWithSkeleton } from 'three/addons/utils/SkeletonUtils.js';

const status = document.getElementById('pastureStatus');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdceef3);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(3, 5, 5);
scene.add(light);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({ color: 0xb4ce91, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.scale.set(20, 20, 1);
scene.add(ground);
camera.position.set(0, 6, 9);
controls.target.set(0, 0.5, 0);
controls.update();

// index.htmlの保存形式・設定と同じ。保存済みデータは読み取りのみ。
const storageKey = 'busakawaRace.characters.v1';
document.getElementById('resetCharacters').addEventListener('click', () => {
  if (!window.confirm('登録したぶさかわを全員削除します。\nこの操作は取り消せません。本当にリセットしますか？')) return;
  try { localStorage.removeItem(storageKey); window.location.reload(); }
  catch { status.textContent = '登録データを削除できなかったよ。ブラウザの保存設定を確認してね。'; }
});

const pastureCharacters = [];
let currentBounds;

// キャラクター本体のlocalStorageとは別に、同じタブの往復で選択を保持。
const entrantSelectionConfig = { maxEntrants: 4, storageKey: 'busakawaRace.entrants.v1' };
const entrantSelection = { mode: false, ids: [], ready: false, message: '' };
const entrantNumbers = ['①','②','③','④'];
const entrantNumber = index => entrantNumbers[index] ?? String(index + 1);
const selectionModeButton = document.getElementById('selectionMode');
const randomEntrantsButton = document.getElementById('randomEntrants');
const clearEntrantsButton = document.getElementById('clearEntrants');
const launchRaceButton = document.getElementById('launchRace');
const selectionStatus = document.getElementById('selectionStatus');
const entrantBadgeMaterials = new Map();
function saveEntrantSelection() {
  try {
    sessionStorage.setItem(entrantSelectionConfig.storageKey, JSON.stringify({schemaVersion:1, ids:[...entrantSelection.ids]}));
    return true;
  } catch {
    entrantSelection.message = '出走者を保存できなかったよ。ブラウザの保存設定を確認してね。';
    return false;
  }
}
function restoreEntrantSelection() {
  try {
    const raw = sessionStorage.getItem(entrantSelectionConfig.storageKey);
    if (raw === null) return;
    const data = JSON.parse(raw);
    if (!data || data.schemaVersion !== 1 || !Array.isArray(data.ids) ||
        !data.ids.every(id => Number.isSafeInteger(id) && id > 0)) throw new Error('invalid');
    const available = new Set(pastureCharacters.map(item => item.id));
    entrantSelection.ids = [...new Set(data.ids)].filter(id => available.has(id)).slice(0,entrantSelectionConfig.maxEntrants);
    if (entrantSelection.ids.length !== data.ids.length) entrantSelection.message = '今いる子だけで出走者を復元したよ。';
  } catch {
    entrantSelection.message = '前回の選択を読み取れなかったよ。出走者を選び直してね。';
  }
}
function renderEntrantSelection() {
  const { ids, mode, ready, message } = entrantSelection;
  selectionModeButton.disabled = !ready || !pastureCharacters.length;
  selectionModeButton.setAttribute('aria-pressed', String(mode));
  selectionModeButton.textContent = mode ? '選択を終える（通常モードへ）' : '出走者を選ぶ';
  randomEntrantsButton.disabled = !ready || ids.length >= Math.min(entrantSelectionConfig.maxEntrants,pastureCharacters.length);
  clearEntrantsButton.disabled = !ids.length;
  launchRaceButton.disabled = !ready || !ids.length;
  selectionStatus.textContent = !ready ? '出走者を読み込み中…' : !pastureCharacters.length
    ? 'まだ出走できる子がいないよ。「顔を作る」から登録してね。'
    : `出走者 ${ids.length} / ${entrantSelectionConfig.maxEntrants}体・${mode ? '選択モード：クリックで追加・解除' : '通常モード：クリックで名前を表示'}${message ? '／' + message : ''}`;
  const rows = Array.from({length:entrantSelectionConfig.maxEntrants}, (_,index) => {
    const row = document.createElement('li');
    const item = pastureCharacters.find(item => item.id === ids[index]);
    row.textContent = `${entrantNumber(index)} ${item?.name ?? '未選択'}`;
    return row;
  });
  document.getElementById('entrantList').replaceChildren(...rows);
  for (const item of pastureCharacters) {
    const index = ids.indexOf(item.id);
    if (index >= 0) {
      if (!entrantBadgeMaterials.has(index)) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 128;
        const context = canvas.getContext('2d');
        context.fillStyle = '#ffdf83'; context.beginPath();
        context.roundRect(4,4,120,120,36); context.fill();
        context.fillStyle = '#304734'; context.font = 'bold 88px sans-serif';
        context.textAlign = 'center'; context.textBaseline = 'middle';
        context.fillText(entrantNumber(index),64,66);
        const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
        entrantBadgeMaterials.set(index,new THREE.SpriteMaterial({map:texture,transparent:true,depthWrite:false,depthTest:false}));
      }
      if (!item.entrantBadge) {
        item.entrantBadge = new THREE.Sprite(entrantBadgeMaterials.get(index));
        item.entrantBadge.name = 'entrantNumber'; item.entrantBadge.renderOrder = 10;
        item.entrantBadge.scale.set(item.surface.maxSize*.38,item.surface.maxSize*.38,1);
        item.entrantBadge.position.set(0,item.label.position.y+item.surface.maxSize*.43,0);
        item.group.add(item.entrantBadge);
      }
      item.entrantBadge.material = entrantBadgeMaterials.get(index);
      item.entrantBadge.visible = true;
    } else if (item.entrantBadge) item.entrantBadge.visible = false;
  }
}
function toggleEntrant(item) {
  if (!entrantSelection.ready || !pastureCharacters.includes(item)) return;
  const index = entrantSelection.ids.indexOf(item.id);
  entrantSelection.message = '';
  if (index >= 0) entrantSelection.ids.splice(index,1);
  else if (entrantSelection.ids.length < entrantSelectionConfig.maxEntrants) entrantSelection.ids.push(item.id);
  else { entrantSelection.message = '出走できるのは最大' + entrantSelectionConfig.maxEntrants + '体だよ。先に選択を解除してね。'; renderEntrantSelection(); return; }
  saveEntrantSelection(); renderEntrantSelection();
}
selectionModeButton.addEventListener('click', () => {
  if (selectionModeButton.disabled) return;
  entrantSelection.mode = !entrantSelection.mode; entrantSelection.message = ''; renderEntrantSelection();
});
randomEntrantsButton.addEventListener('click', () => {
  if (!entrantSelection.ready) return;
  const candidates = pastureCharacters.filter(item => !entrantSelection.ids.includes(item.id));
  // Fisher–Yates。既に選んだ子とその順番は維持する。
  for (let i=candidates.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  entrantSelection.ids.push(...candidates.slice(0,entrantSelectionConfig.maxEntrants-entrantSelection.ids.length).map(item=>item.id));
  entrantSelection.message = ''; saveEntrantSelection(); renderEntrantSelection();
});
clearEntrantsButton.addEventListener('click', () => {
  entrantSelection.ids = []; entrantSelection.message = ''; saveEntrantSelection(); renderEntrantSelection();
});
launchRaceButton.addEventListener('click', () => {
  if (!entrantSelection.ready || !entrantSelection.ids.length) return;
  if (saveEntrantSelection()) window.location.href = './race.html';
  else renderEntrantSelection();
});
renderEntrantSelection();


// 距離・速度はモデルの全高相当(maxSize)を基準にする。
const walkConfig = {
  speedInHeights: [0.28, 0.46],
  walkSeconds: [2.5, 6],
  idleSeconds: [1, 3.5],
  turnRadiansPerSecond: 2.1,
  rangePaddingInHeights: 2,
  groundEdgePaddingInHeights: 0.5,
  boundaryTurnInHeights: 0.9,
  avoidanceInHeights: 0.22,
  rollRadians: 0.045,
  bobInHeights: 0.015,
  strideInHeights: 0.45,
  maxDeltaSeconds: 0.05,
  hipSwingRadians: 0.34,
  kneeBendRadians: 0.45,
  footLiftInHeights: 0.025,
  rigStrideScale: 1,
  rigRollRadians: 0.018,
  rigBobInHeights: 0,
  gaitBlendPerSecond: 12,
  rigGroundClearanceInHeights: 0.0003
};
// モーションだけの設定。移動速度や集合・回避処理の設定はwalkConfig/gatherConfigに残す。
// 'classic' に変えて再読み込みすると従来の足運びと比較できる。
const pastureMotionConfig = {
  mode: 'organic',
  smoothSeconds: 0.16,     // 速度・開始停止・頭の追従のなじみ時間（秒）
  individuality: 0.60,    // IDごとの歩幅・足上げ・揺れ・左右差の強さ（0〜1）
  rhythmVariation: 0.025, // 数歩ごとの小さな歩幅変動。毎フレームの乱数は使わない
  runSpeedRange: [0.45,0.85], // 全高/秒。この速度域で歩行から集合用走行へ滑らかに移る
  walk: {
    stride: 1.0,          // 1周期の歩幅倍率。hipSwingと合わせて調整
    hipSwing: 0.28,       // 足の前後の振り幅（ラジアン）
    stanceRatio: 0.66,    // 接地の比率。残りが足を前へ戻す遊脚期
    footLift: 0.009,      // 足上げ（全高比）
    kneeBend: 0.23,       // 遊脚期の膝曲げ（ラジアン）
    sway: 0.018,          // 左右への体重移動の傾き（ラジアン）
    lateralShift: 0.004,  // 頭と足をまとめた横移動（全高比）
    forwardLean: 0.008,   // 前傾（ラジアン）
    bounce: 0.0012,       // 接地補正に加える上下動（全高比）
    bodyLag: 0.42,        // 足に対する頭の位相遅れ（ラジアン）
    referenceSpeed: 0.38 // 姿勢の強さを決める基準速度（全高/秒）
  },
  run: { // 同じ項目の集合用設定。モーションは切り替えず連続的に補間する。
    stride: 1.16, hipSwing: 0.34, stanceRatio: 0.60,
    footLift: 0.019, kneeBend: 0.44, sway: 0.025, lateralShift: 0.008,
    forwardLean: 0.030, bounce: 0.003, bodyLag: 0.32, referenceSpeed: 0.85
  }
};
const motionParameterKeys=Object.keys(pastureMotionConfig.walk);

const walkBounds = { minX: 0, maxX: 0, minZ: 0, maxZ: 0 };
const walkGrid = new Map();
let walkCellSize = 1;
let walkingReady = false;
let sharedFootContacts;
const rigContactIndexCache = new WeakMap();
const organicContactIndexCache = new WeakMap();
const calibratedRigContacts = new WeakMap();
const gatherRadiusCache = new WeakMap();
const randomBetween = (range) => range[0] + Math.random() * (range[1] - range[0]);


function readRegisteredCharacters() {
  const raw = localStorage.getItem(storageKey);
  if (raw === null) return [];
  let data;
  try { data = JSON.parse(raw); } catch {
    throw new Error('登録データを読み取れなかったよ。保存データは変更していないよ。');
  }
  if (!data || data.schemaVersion !== 1 || !Array.isArray(data.characters) ||
      !Number.isSafeInteger(data.nextNumber) || data.nextNumber < 1) {
    throw new Error('登録データの形式を確認できなかったよ。保存データは変更していないよ。');
  }
  const ids = new Set();
  for (const record of data.characters) {
    if (!record || !Number.isSafeInteger(record.id) || record.id < 1 || ids.has(record.id) ||
        record.name !== `ぶさかわ${String(record.id).padStart(3, '0')}` ||
        !record.parts || typeof record.parts !== 'object') {
      throw new Error('登録データを確認できなかったよ。顔を作る画面へ戻って確認してね。');
    }
    ids.add(record.id);
    for (const slot of partSlots) {
      const part = record.parts[slot];
      // データにないパーツは補完しない。
      if (part === undefined) continue;
      if (!part || typeof part.exists !== 'boolean' || !Object.hasOwn(partSettings, part.type) ||
          ![part.x, part.y, part.rotation].every(Number.isFinite)) {
        throw new Error(`${record.name}の顔データを確認できなかったよ。保存データは残してあるよ。`);
      }
    }
  }
  return data.characters;
}

// GLBは種類ごとに1回だけ読み込み、個体は骨を含めて複製する。
const loader = new GLTFLoader();
const loadTemplate=createModelCache(loader);

// 計算は生成時だけ。制作画面と同じ座標系の中で復元してから個体全体を移動する。
function createHeadSurface(character) {
  character.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(character);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxSize = Math.max(size.x, size.y, size.z);
  const headRadius = Math.min(size.x * 0.48, size.y * 0.34);
  const headCenter = new THREE.Vector3(center.x, box.max.y - headRadius, center.z);
  const headMinY = headCenter.y - headRadius;
  const meshes = [];
  character.traverse((object) => {
    if (object.isMesh) {
      meshes.push(object);
      if (object.isSkinnedMesh) object.skeleton.update();
    }
  });
  const raycaster = new THREE.Raycaster();
  const direction = new THREE.Vector3(0, 0, -1);
  const forward = new THREE.Vector3(0, 0, 1);
  const rayHits = [];
  const intersect = () => {
    rayHits.length = 0;
    return raycaster.intersectObjects(meshes, false, rayHits);
  };

  function placement(x, y, rotation, halfWidth, halfHeight, rearDepth, fixedDepth) {
    const worldY = headCenter.y + headRadius * y;
    if (worldY < headMinY || worldY > box.max.y) return null;
    raycaster.set(new THREE.Vector3(headCenter.x + headRadius * x, worldY, box.max.z + maxSize), direction);
    raycaster.near = 0;
    raycaster.far = size.z + maxSize * 2;
    const hit = intersect().find((h) => h.face && h.point.y >= headMinY);
    if (!hit) return null;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    hit.object.getVertexPosition(hit.face.a, a).applyMatrix4(hit.object.matrixWorld);
    hit.object.getVertexPosition(hit.face.b, b).applyMatrix4(hit.object.matrixWorld);
    hit.object.getVertexPosition(hit.face.c, c).applyMatrix4(hit.object.matrixWorld);
    const normal = new THREE.Vector3().crossVectors(b.sub(a), c.sub(a));
    if (normal.lengthSq() < 1e-20) return null;
    normal.normalize();
    if (normal.dot(direction) > 0) normal.negate();
    const orientation = new THREE.Quaternion().setFromUnitVectors(forward, normal);
    const sampleDirection = normal.clone().negate();
    const sampleOffset = new THREE.Vector3(), sampleOrigin = new THREE.Vector3();
    const riseVector = new THREE.Vector3();
    let surfaceRise = 0;
    // 回転を入れる前の9点補正。制作画面と同じく、角度で取り付け位置はずれない。
    for (let ix = -1; ix <= 1; ix++) {
      for (let iy = -1; iy <= 1; iy++) {
        sampleOffset.set(ix * halfWidth, iy * halfHeight, 0).applyQuaternion(orientation);
        sampleOrigin.copy(hit.point).add(sampleOffset).addScaledVector(normal, maxSize);
        raycaster.set(sampleOrigin, sampleDirection);
        raycaster.near = 0;
        raycaster.far = maxSize * 2;
        const sampleHit = intersect().find((h) => h.point.y >= headMinY);
        if (sampleHit) surfaceRise = Math.max(surfaceRise, riseVector.subVectors(sampleHit.point, hit.point).dot(normal));
      }
    }
    const normalizedRotation = rotation >= -180 && rotation <= 180
      ? rotation : ((rotation % 360 + 540) % 360) - 180;
    const offset = rearDepth + surfaceRise + maxSize * 0.001 + headRadius * fixedDepth;
    return {
      position: hit.point.clone().addScaledVector(normal, offset),
      quaternion: orientation.multiply(new THREE.Quaternion().setFromAxisAngle(forward, THREE.MathUtils.degToRad(normalizedRotation)))
    };
  }
  return { box, center, size, maxSize, headRadius, placement };
}

function restorePart(template, saved, surface) {
  const settings = partSettings[saved.type];
  const part = cloneWithSkeleton(template);
  const originalSize = new THREE.Box3().setFromObject(part).getSize(new THREE.Vector3());
  const maxPartSize = Math.max(originalSize.x, originalSize.y, originalSize.z);
  if (maxPartSize <= 0) throw new Error(`${saved.type}の大きさを取得できなかったよ。`);
  part.scale.multiplyScalar(surface.headRadius * settings.sizeMultiplier / maxPartSize);
  const scaledBox = new THREE.Box3().setFromObject(part);
  const scaledSize = scaledBox.getSize(new THREE.Vector3());
  part.position.sub(scaledBox.getCenter(new THREE.Vector3()));
  const group = new THREE.Group();
  group.name = saved.type;
  group.add(part);
  group.updateMatrixWorld(true);
  const adjustment=readPartAdjustment(saved,settings);
  const bounds=adjustedPartBounds(new THREE.Box3().setFromObject(group),adjustment.scale,adjustment.tilt);
  const adjustedSize=bounds.getSize(new THREE.Vector3());
  const rearDepth = Math.max(0, -bounds.min.z);
  const pose = surface.placement(saved.x, saved.y, saved.rotation,
    adjustedSize.x * 0.5, adjustedSize.y * 0.5, rearDepth, settings.depthLocked ? settings.fixedDepth : (Number.isFinite(saved.depth) ? saved.depth : settings.fixedDepth));
  if (!pose) throw new Error(`${saved.type}の保存位置に頭の表面が見つからなかったよ。`);
  group.position.copy(pose.position);
  group.quaternion.copy(pose.quaternion);
  applyPartAdjustment(group,adjustment.scale,adjustment.tilt);
  return group;
}

function makeNameLabel(name, maxSize) {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 160;
  const context = canvas.getContext('2d');
  context.fillStyle = 'rgba(255,255,255,0.6)';
  context.beginPath();
  context.roundRect(14, 12, 612, 136, 46);
  context.fill();
  context.fillStyle = '#304734';
  context.font = 'bold 52px sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(name, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
  label.scale.set(maxSize * 1.55, maxSize * 0.39, 1);
  label.name = 'registrationLabel';
  label.visible = false;
  return label;
}

function createPastureCharacter(record, templates) {
  const group = new THREE.Group();
  group.name = record.name;
  // modelSpace内では制作時の座標系を維持する。
  const modelSpace = new THREE.Group();
  const character = cloneWithSkeleton(templates.character);
  modelSpace.add(character);
  const surface = createHeadSurface(character);
  const legRig = createLegRig(character, surface);
  // 矩形の対角線ではなく実メッシュの水平投影から集合用の占有円を求める。
  // 初期姿勢の測定をテンプレート単位で再利用し、足の動き用の余白を加える。
  if(!gatherRadiusCache.has(templates.character)) {
    let footprint=0;
    const vertex=new THREE.Vector3();
    character.traverse(mesh=>{
      if(!mesh.isMesh) return;
      for(let i=0;i<mesh.geometry.attributes.position.count;i++) {
        mesh.getVertexPosition(i,vertex).applyMatrix4(mesh.matrixWorld);
        footprint=Math.max(footprint,Math.hypot(vertex.x-surface.center.x,vertex.z-surface.center.z));
      }
    });
    gatherRadiusCache.set(templates.character,footprint+surface.maxSize*.045);
  }
  const gatherRadius=gatherRadiusCache.get(templates.character);
  const parts = new Map();
  for (const slot of partSlots) {
    const saved = record.parts[slot];
    if (!saved || saved.exists !== true) continue;
    const partGroup = restorePart(templates.parts.get(saved.type), saved, surface);
    parts.set(slot, partGroup);
    modelSpace.add(partGroup);
  }
  // 頭足人と顔をまとめて足元を地面に、左右の中心を原点に揃える。
  modelSpace.position.set(-surface.center.x, -surface.box.min.y, -surface.center.z);
  // 移動・向きはgroup、よちよちした傾きはwalkPivotに分ける。
  // 顔と体は同じwalkPivot内、番号はその外なので文字は揺れない。
  const walkPivot = new THREE.Group();
  walkPivot.add(modelSpace);
  group.add(walkPivot);
  if (!sharedFootContacts) sharedFootContacts = collectFootContacts(character, surface);
  const label = makeNameLabel(record.name, surface.maxSize);
  label.position.set(0, surface.size.y + surface.maxSize * 0.3, 0);
  group.add(label);
  const radius = Math.hypot(surface.size.x, surface.size.z) * 0.53;
  return { id: record.id, name: record.name, group, walkPivot, modelSpace,
    character, parts, surface, label, radius, gatherRadius, legRig,
    behavior: {
      mode: 'free', state: 'idle', remaining: Math.random() * 1.8 + 0.2,
      heading: Math.random() * Math.PI * 2,
      speed: surface.maxSize * randomBetween(walkConfig.speedInHeights),
      phase: Math.random() * Math.PI * 2, weight: 0, neighbors: []
    }
  };
}

// 集合・選択は表示だけの状態。登録データには書き込まない。
let gathering = false, selectedCharacter = null;
const gatherConfig = { speedMultiplier: 2, replanSeconds: 0.6, escapeSeconds: 1.5, yieldSeconds: 2 };
let gatherFrame = 0;
let formationHeading = 0;
const gatherButton = document.getElementById('gather');
const dismissButton = document.getElementById('dismiss');
function refreshLabels() {
  for (const item of pastureCharacters) item.label.visible = gathering
    ? item.behavior.mode === 'arrived' : item === selectedCharacter;
}
const pickRay = new THREE.Raycaster(), pickPoint = new THREE.Vector2();
const pickMeshes = [], meshOwners = new WeakMap(), pointers = new Map();
let dragged = false;
renderer.domElement.addEventListener('pointerdown', e => {

  else dragged = false;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

const gatherRadiusOf = item => item.gatherRadius ?? item.radius;
const distanceXZ = (a,b) => Math.hypot(a.x-b.x, a.z-b.z);
function turnTo(item, heading, dt) {
  const d = Math.atan2(Math.sin(heading-item.group.rotation.y), Math.cos(heading-item.group.rotation.y));
  item.group.rotation.y += THREE.MathUtils.clamp(d, -2.1*dt, 2.1*dt);
  return Math.abs(d);
}
// 線分と他個体の円形占有領域を検査。待機中・到着済みの子も障害物に含める。
function clearSegment(item, a, b) {
  const vx=b.x-a.x, vz=b.z-a.z, length=vx*vx+vz*vz;
  for (const other of pastureCharacters) {
    if (other===item) continue;
    const p=other.group.position;
    const t=length ? THREE.MathUtils.clamp(((p.x-a.x)*vx+(p.z-a.z)*vz)/length,0,1) : 0;
    const clearance=gatherRadiusOf(item)+gatherRadiusOf(other)+item.surface.maxSize*.035;
    const closest=Math.hypot(a.x+t*vx-p.x,a.z+t*vz-p.z), initial=distanceXZ(a,p);
    if (closest < clearance) {
      // 自由歩行から集合へ切り替えた直後の狭い隙間では、離れる移動だけ許す。
      if(initial>=clearance || closest<initial-1e-8 || distanceXZ(b,p)<=initial) return false;
    }
  }
  return true;
}
// A*で回り道を探す。移動は常に歩行速度以内で、座標の瞬間移動はしない。
function findRoute(item, goal) {
  const start=item.group.position;
  if (clearSegment(item,start,goal)) return [goal.clone()];
  const h=Math.max(...pastureCharacters.map(c=>c.surface.maxSize));
  const step=h*.3, pad=item.radius+h*.05;
  const minX=walkBounds.minX+pad, maxX=walkBounds.maxX-pad;
  const minZ=walkBounds.minZ+pad, maxZ=walkBounds.maxZ-pad;
  const nx=Math.ceil((maxX-minX)/step), nz=Math.ceil((maxZ-minZ)/step);
  const point=(x,z)=>new THREE.Vector3(minX+(maxX-minX)*x/nx,0,minZ+(maxZ-minZ)*z/nz);
  const key=(x,z)=>z*(nx+1)+x;
  const open=[], best=new Map(), closed=new Set();
  // 接続できる近傍格子から開始。狭い隙間の斜めすり抜けは線分検査で防ぐ。
  const sx=Math.round((start.x-minX)/(maxX-minX)*nx), sz=Math.round((start.z-minZ)/(maxZ-minZ)*nz);
  for(let x=Math.max(0,sx-2);x<=Math.min(nx,sx+2);x++) for(let z=Math.max(0,sz-2);z<=Math.min(nz,sz+2);z++) {
    const p=point(x,z);
    if(!clearSegment(item,start,p)) continue;
    const g=distanceXZ(start,p), n={x,z,p,g,f:g+distanceXZ(p,goal),parent:null};
    open.push(n); best.set(key(x,z),g);
  }
  while(open.length) {
    let index=0; for(let i=1;i<open.length;i++) if(open[i].f<open[index].f) index=i;
    const n=open.splice(index,1)[0], k=key(n.x,n.z);
    if(closed.has(k)) continue; closed.add(k);
    if(distanceXZ(n.p,goal)<step*2 && clearSegment(item,n.p,goal)) {
      const route=[goal.clone()]; for(let c=n;c;c=c.parent) route.push(c.p); route.reverse();
      // 見通せる区間はまとめる。格子の角で細かく折り返さず、安全な最短の線分を辿る。
      const smooth=[]; let from=start;
      for(let i=0;i<route.length;) {
        let next=route.length-1;
        while(next>i && !clearSegment(item,from,route[next])) next--;
        smooth.push(route[next]); from=route[next]; i=next+1;
      }
      return smooth;
    }
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++) {
      if(!dx&&!dz) continue;
      const x=n.x+dx,z=n.z+dz;
      if(x<0||x>nx||z<0||z>nz||closed.has(key(x,z))) continue;
      const p=point(x,z),g=n.g+distanceXZ(n.p,p);
      if(g>=(best.get(key(x,z))??Infinity)||!clearSegment(item,n.p,p)) continue;
      best.set(key(x,z),g); open.push({x,z,p,g,f:g+distanceXZ(p,goal),parent:n});
    }
  }
  return null;
}
// 各個体が経路・速度・渋滞時間を所有する。経路探索の予算だけを共有し、移動は全員同時。
function updateGather(dt) {
  let planningBudget = 2;
  const count = pastureCharacters.length;
  gatherFrame++;
  // 更新順を循環し、同じ個体ばかりが通行・再探索で優先されないようにする。
  for (let index=0; index<count; index++) {
    const item=pastureCharacters[(index+gatherFrame)%count];
    const state=item.behavior, motion=state.gatherMotion, p=item.group.position;
    const h=item.surface.maxSize;
    if(state.mode==='arrived') {
      turnTo(item,formationHeading,dt); updateWalkVisual(item,0,dt); continue;
    }
    motion.retry-=dt;
    while(motion.route.length && distanceXZ(p,motion.route[0])<h*1e-6) motion.route.shift();
    if(motion.waitFor!==undefined && !motion.route.length) {
      const requester=pastureCharacters.find(other=>other.id===motion.waitFor);
      if(requester && requester.behavior.mode!=='arrived') {
        updateWalkVisual(item,0,dt); continue;
      }
      delete motion.waitFor; motion.noProgress=0; motion.stalled=0; motion.bestDistance=distanceXZ(p,state.goal);
    }
    if(!motion.route.length && distanceXZ(p,state.goal)<h*.015) {
      state.mode='arrived'; motion.route=[];
      // 同じフレームで別の子に道を譲る場合も、到着の通知を先に全待機個体へ届ける。
      for(const waiting of pastureCharacters) {
        const pending=waiting.behavior.gatherMotion;
        if(pending.waitFor===item.id) {
          delete pending.waitFor; pending.noProgress=0; pending.stalled=0;
          pending.bestDistance=distanceXZ(waiting.group.position,waiting.behavior.goal);
        }
      }
      turnTo(item,formationHeading,dt); updateWalkVisual(item,0,dt); continue;
    }
    // 動的な障害物で進めなくなった時だけA*を再実行。各経路は独立して保持する。
    if((motion.stalled>.45 || motion.noProgress>gatherConfig.yieldSeconds) && motion.retry<=0 && planningBudget>0) {
      planningBudget--; motion.retry=gatherConfig.replanSeconds+motion.variation*.3;
      // 整列済みの列が入口を塞いだ場合も、その子自身の経路で一時的に道を譲る。
      // 他の個体は移動を続けるので、単独通行の待ち行列にはしない。
      let route=findRoute(item,motion.waitFor!==undefined && motion.route.length ? motion.route.at(-1) : state.goal);
      if(!route && motion.noProgress>gatherConfig.yieldSeconds) {
        for(const other of pastureCharacters) {
          if(other.behavior.mode!=='arrived' || Math.min(distanceXZ(other.group.position,p),distanceXZ(other.group.position,state.goal))>h*2.2) continue;
          const yielding=other.behavior.gatherMotion;
          for(let attempt=0;attempt<48;attempt++) {
            const angle=yielding.detour++*2.399963;
            const target=other.group.position.clone().add(new THREE.Vector3(Math.sin(angle),0,Math.cos(angle)).multiplyScalar(h*(2+attempt*.2)));
            if(target.x<walkBounds.minX+other.radius||target.x>walkBounds.maxX-other.radius||target.z<walkBounds.minZ+other.radius||target.z>walkBounds.maxZ-other.radius) continue;
            if(pastureCharacters.some(c=>distanceXZ(c.behavior.goal,target)<gatherRadiusOf(other)+gatherRadiusOf(c)+h*.2)) continue;
            const detour=clearSegment(other,other.group.position,target) ? [target] : null;
            if(detour) { yielding.route=detour; yielding.stalled=0; yielding.retry=3; yielding.noProgress=0; yielding.waitFor=item.id; other.behavior.mode='gather'; motion.noProgress=0; break; }
          }
          if(motion.noProgress===0) break;
        }
      }
      if(!route && motion.stalled>gatherConfig.escapeSeconds) {
        // 正面衝突や袋小路では、一度横へ退いてから自分の整列位置へ再出発する。
        for(let attempt=0;attempt<12 && !route;attempt++) {
          const angle=motion.detour++*2.399963;
          const target=p.clone().add(new THREE.Vector3(Math.sin(angle),0,Math.cos(angle)).multiplyScalar(h*(1.2+attempt*.15)));
          if(target.x<walkBounds.minX+item.radius||target.x>walkBounds.maxX-item.radius||target.z<walkBounds.minZ+item.radius||target.z>walkBounds.maxZ-item.radius) continue;
          route=findRoute(item,target);
        }
      }
      if(route) { motion.route=route; motion.stalled=0; motion.noProgress=0; motion.bestDistance=distanceXZ(p,state.goal); }
    }
    while(motion.route.length && distanceXZ(p,motion.route[0])<h*1e-6) motion.route.shift();
    const target=motion.route[0] || state.goal;
    const remaining=distanceXZ(p,target), heading=Math.atan2(target.x-p.x,target.z-p.z);
    const speed=state.speed*gatherConfig.speedMultiplier;
    let best=null, bestScore=-Infinity;
    // 安全な経路がある時はその線分を素直に辿り、近隣への過剰な迂回で振動しないようにする。
    if(motion.route.length && clearSegment(item,p,target)) {
      const step=Math.min(remaining,speed*dt);
      best={next:p.clone().lerp(target,remaining ? step/remaining : 0),angle:heading,step}; bestScore=1;
    } else {
      // 予測した近隣との距離で減速・回避候補を評価。狭い所でも全員の候補を毎フレーム検討。
      for(const offset of [0,.3,-.3,.65,-.65,1.05,-1.05,1.5,-1.5,2.1,-2.1,Math.PI]) {
        for(const factor of [1,.45]) {
          const angle=heading+offset, step=Math.min(remaining,speed*factor*dt);
          const next=p.clone().add(new THREE.Vector3(Math.sin(angle)*step,0,Math.cos(angle)*step));
          if(next.x<walkBounds.minX+item.radius||next.x>walkBounds.maxX-item.radius||next.z<walkBounds.minZ+item.radius||next.z>walkBounds.maxZ-item.radius) continue;
          if(!clearSegment(item,p,next)) continue;
          let crowd=0;
          for(const other of pastureCharacters) {
            if(other===item) continue;
            const gap=distanceXZ(next,other.group.position)-gatherRadiusOf(item)-gatherRadiusOf(other);
            crowd+=Math.max(0,h*.25-gap)/h;
          }
          const progress=(remaining-distanceXZ(next,target))/Math.max(speed*dt,1e-9);
          const score=progress-crowd*.08 + Math.sin(offset)*motion.side*.01;
          if(score>bestScore) { bestScore=score; best={next,angle,step}; }
        }
      }
    }
    let distance=0;
    // 通常は目的地へ進む。渋滞中は横・後方への退避も許すが瞬間移動はしない。
    if(best && (bestScore>0 || motion.stalled>.6)) {
      turnTo(item,best.angle,dt);
      distance=distanceXZ(p,best.next); p.copy(best.next);
    } else turnTo(item,heading,dt);
    motion.noProgress+=dt;
    const goalDistance=distanceXZ(p,state.goal);
    if(goalDistance<motion.bestDistance-h*.08) { motion.bestDistance=goalDistance; motion.noProgress=0; }
    if(remaining-distanceXZ(p,target)>speed*dt*.08) { motion.stalled=0; }
    else motion.stalled+=dt;
    updateWalkVisual(item,distance,dt);
  }
  refreshLabels();
  const arrived=pastureCharacters.filter(item=>item.behavior.mode==='arrived').length;
  status.textContent=arrived===count ? `${arrived}体、集合できたよ！` : `集合中… ${arrived} / ${count}体が到着`;
}
gatherButton.addEventListener('click',()=>{
  if(!walkingReady || gathering) return;
  gathering=true; selectedCharacter=null; gatherFrame=0;
  const n=pastureCharacters.length;
  const h=Math.max(...pastureCharacters.map(c=>c.surface.maxSize));
  const r=Math.max(...pastureCharacters.map(c=>c.radius));
  // カメラの水平投影を正面として固定。集合後もOrbitControlsは自由に操作可能。
  const front=camera.position.clone().sub(controls.target); front.y=0;
  if(front.lengthSq()<1e-8) front.set(0,0,1); front.normalize();
  formationHeading=Math.atan2(front.x,front.z);
  const right=new THREE.Vector3(front.z,0,-front.x);
  const columns=Math.min(5,Math.ceil(Math.sqrt(n))), rows=Math.ceil(n/columns);
  const spacing=Math.max(h*1.3,r*2.2+h*.1); // ぶさかわの大きさに応じて間隔を調整
  const halfWidth=(columns-1)*spacing/2, halfDepth=(rows-1)*spacing/2; // 集合後のぶさかわの占有領域
  const extentX=Math.abs(right.x)*halfWidth+Math.abs(front.x)*halfDepth;
  const extentZ=Math.abs(right.z)*halfWidth+Math.abs(front.z)*halfDepth;
  const half=Math.max(walkBounds.maxX,walkBounds.maxZ,extentX+r+h*2,extentZ+r+h*2);
  Object.assign(walkBounds,{minX:-half,maxX:half,minZ:-half,maxZ:half});
  ground.scale.set(Math.max(ground.scale.x,half*2+h*2),Math.max(ground.scale.y,half*2+h*2),1);
  const room=Math.max(0,Math.min((walkBounds.maxX-extentX-r)/Math.max(Math.abs(front.x),1e-6),(walkBounds.maxZ-extentZ-r)/Math.max(Math.abs(front.z),1e-6)));
  const center=front.clone().multiplyScalar(Math.min(room*.6,h*2));
  // 後列から前列へ。各行の人数に合わせて中央寄せ。
  pastureCharacters.forEach((item,i)=>{
    const row=Math.floor(i/columns), col=i%columns, count=Math.min(columns,n-row*columns);
    item.behavior.goal=center.clone().addScaledVector(right,(col-(count-1)/2)*spacing).addScaledVector(front,(row-(rows-1)/2)*spacing);
    item.behavior.mode='gather';
    item.behavior.gatherMotion={route:[item.behavior.goal.clone()], retry:0, stalled:0, noProgress:0,
      bestDistance:distanceXZ(item.group.position,item.behavior.goal), variation:Math.random(),
      side:i%2 ? 1 : -1, detour:i*7};
  });
  const box=new THREE.Box3();
  for(const item of pastureCharacters) {
    box.expandByPoint(item.group.position); box.expandByPoint(item.behavior.goal);
  }
  box.expandByScalar(h*1.6); currentBounds=box; fitCamera(box);
  const viewDistance=camera.position.distanceTo(controls.target);
  camera.position.copy(controls.target).addScaledVector(front.clone().add(new THREE.Vector3(0,.75,0)).normalize(),viewDistance);
  controls.update();
  gatherButton.disabled=true; dismissButton.disabled=false; refreshLabels();
});
dismissButton.addEventListener('click',()=>{
  gathering=false; selectedCharacter=null;
  for(const item of pastureCharacters) {
    Object.assign(item.behavior,{mode:'free',state:'walking',remaining:randomBetween(walkConfig.walkSeconds),heading:Math.random()*Math.PI*2});
  }
  refreshLabels(); gatherButton.disabled=false; dismissButton.disabled=true;
  status.textContent=`${pastureCharacters.length}体のぶさかわが暮らしているよ`;
});

// GLTFLoaderはLeg.L等のピリオドを除去するので、両表記を受け付ける。
function createLegRig(character, surface) {
  const bones = new Map();
  const meshes = [];
  character.traverse((object) => {
    if (object.isBone) bones.set(object.name.replace(/[._\s-]/g, ''), object);
    if (object.isSkinnedMesh) meshes.push(object);
  });
  const legs = [];
  let reach = 0;
  for (const side of ['L', 'R']) {
    const hip = bones.get(`Leg${side}`), knee = bones.get(`Leg2${side}`), foot = bones.get(`Foot${side}`);
    if (!hip || !knee || !foot || knee.parent !== hip || foot.parent !== knee) return null;
    const makeJoint = (bone) => ({
      bone,
      rest: bone.quaternion.clone(),
      delta: new THREE.Quaternion(),
      // Blender由来のボーンのローカル軸に依存せず、モデルの左右軸で前後に振る。
      axis: new THREE.Vector3(1, 0, 0).applyQuaternion(bone.getWorldQuaternion(new THREE.Quaternion()).invert())
    });
    reach += Math.abs(hip.getWorldPosition(new THREE.Vector3()).y - foot.getWorldPosition(new THREE.Vector3()).y);
    legs.push({ side, hip: makeJoint(hip), knee: makeJoint(knee), foot: makeJoint(foot),
      restPosition: hip.position.clone(),
      up: new THREE.Vector3(0, 1, 0).applyQuaternion(hip.parent.getWorldQuaternion(new THREE.Quaternion()).invert()) });
  }
  if (!meshes.length) return null;
  const contacts = [];
  const vertex = new THREE.Vector3();
  for (const mesh of meshes) {
    let cached = rigContactIndexCache.get(mesh.geometry);
    if (!cached) {
      cached = [];
      const organicIndices = new Set();
      const indices = mesh.geometry.attributes.skinIndex;
      const weights = mesh.geometry.attributes.skinWeight;
      if (!indices || !weights) return null;
      for (const leg of legs) {
        const footIndex = mesh.skeleton.bones.indexOf(leg.foot.bone);
        const points = [];
        for (let i = 0; i < indices.count; i++) {
          let footWeight = 0;
          for (let k = 0; k < 4; k++) if (indices.getComponent(i, k) === footIndex) footWeight += weights.getComponent(i, k);
          if (footWeight < 0.5) continue;
          mesh.getVertexPosition(i, vertex).applyMatrix4(mesh.matrixWorld);
          if (vertex.y <= surface.box.min.y + surface.maxSize * 0.07) points.push({ x: vertex.x, y: vertex.y, index: i, blended: footWeight < 0.99999 });
        }
        for(const point of points)organicIndices.add(point.index);
        // 足首の逆回転で足裏の向きが保たれるため、足裏のXY凸包が接地判定に使える。
        points.sort((a, b) => a.x - b.x || a.y - b.y);
        const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
        const lower = [], upper = [];
        for (const point of points) {
          while (lower.length > 1 && cross(lower.at(-2), lower.at(-1), point) <= 0) lower.pop();
          lower.push(point);
        }
        for (let i = points.length - 1; i >= 0; i--) {
          const point = points[i];
          while (upper.length > 1 && cross(upper.at(-2), upper.at(-1), point) <= 0) upper.pop();
          upper.push(point);
        }
        if (points.length < 2) return null;
        lower.pop(); upper.pop();
        // 混合ウェイトの頂点は骨の逆回転でも変形するため、凸包から省かない。
        const sampleIndices = new Set(lower.concat(upper).map((point) => point.index));
        for (const point of points) if (point.blended) sampleIndices.add(point.index);
        for (const index of sampleIndices) cached.push(index);
      }
      rigContactIndexCache.set(mesh.geometry, cached);
      organicContactIndexCache.set(mesh.geometry,[...organicIndices]);
    }
    const selected = calibratedRigContacts.get(mesh.geometry) || cached;
    for (const index of selected) contacts.push({ mesh, index });
  }
  // 1周期の前後ストロークと実際の移動距離を揃え、足滑りを抑える。
  const strideLength = reach * 0.5 * 4 * Math.sin(walkConfig.hipSwingRadians) * walkConfig.rigStrideScale;
  if (!contacts.length || strideLength <= 0) return null;
  const rig = { legs, meshes, contacts, vertex, strideLength };
  if (contacts.length > 160) calibrateRigContactSamples(character, rig, surface);
  // 新しい足運びと前傾では旧周期用の8点だけでは足りない。
  // 生成時に取得済みの足裏候補（前後傾斜も扱うためXY凸包には絞らない）を再利用し、Raycasterや全身の再走査は行わない。
  rig.organicContacts=[];
  for(const mesh of meshes)for(const index of organicContactIndexCache.get(mesh.geometry))rig.organicContacts.push({mesh,index});
  return rig;
}

function applyLegPose(rig, phase, weight, maxSize) {
  for (let i = 0; i < rig.legs.length; i++) {
    const leg = rig.legs[i];
    const legPhase = phase + i * Math.PI;
    const swing = Math.max(0, Math.cos(legPhase));
    const hip = -Math.sin(legPhase) * walkConfig.hipSwingRadians * weight;
    const knee = swing * swing * walkConfig.kneeBendRadians * weight;
    setJointAngle(leg.hip, hip);
    setJointAngle(leg.knee, knee);
    setJointAngle(leg.foot, -hip - knee);
    leg.hip.bone.position.copy(leg.restPosition).addScaledVector(leg.up,
      swing * swing * maxSize * walkConfig.footLiftInHeights * weight);
  }
}

function setJointAngle(joint, angle) {
  joint.delta.setFromAxisAngle(joint.axis, angle);
  joint.bone.quaternion.copy(joint.rest).multiply(joint.delta);
}

function calibrateRigContactSamples(character, rig, surface) {
  // 混合ウェイトの候補から歩行1周期・複数のブレンド量で最下点になる頂点を選ぶ。
  // GLBの種類ごとに初回だけ行い、各個体は同じ頂点番号と独立した骨を使う。
  const selected = new Set();
  for (const weight of [0, 0.25, 0.5, 0.75, 1]) {
    for (let sample = 0; sample < 64; sample++) {
      const phase = sample / 64 * Math.PI * 2;
      applyLegPose(rig, phase, weight, surface.maxSize);
      character.updateMatrixWorld(true);
      for (const mesh of rig.meshes) mesh.skeleton.update();
      const roll = Math.sin(phase) * walkConfig.rigRollRadians * weight;
      const sin = Math.sin(roll), cos = Math.cos(roll);
      let minimum = Infinity, lowest;
      for (const contact of rig.contacts) {
        contact.mesh.getVertexPosition(contact.index, rig.vertex).applyMatrix4(contact.mesh.matrixWorld);
        const y = (rig.vertex.x - surface.center.x) * sin + (rig.vertex.y - surface.box.min.y) * cos;
        if (y < minimum) { minimum = y; lowest = contact; }
      }
      if (lowest) selected.add(lowest);
    }
  }
  applyLegPose(rig, 0, 0, surface.maxSize);
  character.updateMatrixWorld(true);
  for (const mesh of rig.meshes) mesh.skeleton.update();
  rig.contacts = [...selected];
  for (const mesh of rig.meshes) {
    calibratedRigContacts.set(mesh.geometry, rig.contacts.filter((c) => c.mesh === mesh).map((c) => c.index));
  }
}

function rigGroundHeight(item) {
  // 脚の新しい姿勢を反映して、少数の足裏頂点だけをスキニングする。
  // 体と顔の親グループを一緒に補正し、頭の骨Bodyには手を加えない。
  item.walkPivot.position.y = 0;
  item.group.updateMatrixWorld(true);
  const rig = item.legRig;
  for (const mesh of rig.meshes) mesh.skeleton.update();
  let footY = Infinity;
  const contacts=pastureMotionConfig.mode==='organic' ? rig.organicContacts : rig.contacts;
  for (const contact of contacts) {
    contact.mesh.getVertexPosition(contact.index, rig.vertex).applyMatrix4(contact.mesh.matrixWorld);
    footY = Math.min(footY, rig.vertex.y);
  }
  return Number.isFinite(footY) ? -footY + item.surface.maxSize * walkConfig.rigGroundClearanceInHeights : 0;
}

// 足付近の頂点を初回だけ調べ、XY平面の凸包に絞る。
// 傾きによる最下点を少数の接地点だけで計算でき、毎フレームのBox3/Raycasterは不要。
function collectFootContacts(character, surface) {
  const points = [];
  const vertex = new THREE.Vector3();
  character.traverse((mesh) => {
    if (!mesh.isMesh) return;
    for (let i = 0; i < mesh.geometry.attributes.position.count; i++) {
      mesh.getVertexPosition(i, vertex).applyMatrix4(mesh.matrixWorld);
      if (vertex.y <= surface.box.min.y + surface.maxSize * 0.2) {
        points.push({ x: vertex.x - surface.center.x, y: vertex.y - surface.box.min.y });
      }
    }
  });
  points.sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  const lower = [], upper = [];
  for (const point of points) {
    while (lower.length > 1 && cross(lower.at(-2), lower.at(-1), point) <= 0) lower.pop();
    lower.push(point);
  }
  for (let i = points.length - 1; i >= 0; i--) {
    const point = points[i];
    while (upper.length > 1 && cross(upper.at(-2), upper.at(-1), point) <= 0) upper.pop();
    upper.push(point);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function initializeWalking(characters) {
  let maxSize = 0, maxRadius = 0, extentX = 0, extentZ = 0, top = 0;
  for (const item of characters) {
    maxSize = Math.max(maxSize, item.surface.maxSize);
    maxRadius = Math.max(maxRadius, item.radius);
    extentX = Math.max(extentX, Math.abs(item.group.position.x) + item.radius);
    extentZ = Math.max(extentZ, Math.abs(item.group.position.z) + item.radius);
    top = Math.max(top, item.label.position.y + item.surface.maxSize * 0.2);
  }
  const padding = maxSize * walkConfig.rangePaddingInHeights;
  const edge = maxSize * walkConfig.groundEdgePaddingInHeights;
  const halfX = Math.min(ground.scale.x * 0.5 - edge, extentX + padding);
  const halfZ = Math.min(ground.scale.y * 0.5 - edge, extentZ + padding);
  Object.assign(walkBounds, { minX: -halfX, maxX: halfX, minZ: -halfZ, maxZ: halfZ });
  walkCellSize = maxRadius * 2 + maxSize * walkConfig.avoidanceInHeights;
  walkingReady = true;
  // 歩行後もカメラ外へ消えにくいよう、移動範囲全体を初期画角に含める。
  return new THREE.Box3(new THREE.Vector3(-halfX, 0, -halfZ), new THREE.Vector3(halfX, top, halfZ));
}

function gatherWalkNeighbors(item) {
  const neighbors = item.behavior.neighbors;
  neighbors.length = 0;
  const cellX = Math.floor(item.group.position.x / walkCellSize);
  const cellZ = Math.floor(item.group.position.z / walkCellSize);
  for (let x = cellX - 1; x <= cellX + 1; x++) {
    for (let z = cellZ - 1; z <= cellZ + 1; z++) {
      const bucket = walkGrid.get(`${x},${z}`);
      if (bucket) for (const other of bucket) if (other !== item) neighbors.push(other);
    }
  }
}

function updateClassicWalkVisual(item, distance, dt) {
  const state = item.behavior;
  const stride = item.legRig?.strideLength || item.surface.maxSize * walkConfig.strideInHeights;
  if (distance > 0) state.phase = (state.phase + distance / stride * Math.PI * 2) % (Math.PI * 2);
  const blend = 1 - Math.exp(-walkConfig.gaitBlendPerSecond * dt);
  state.weight += ((distance > 0 ? 1 : 0) - state.weight) * blend;
  if (state.weight < 0.001) state.weight = 0;
  const rollAmount = item.legRig ? walkConfig.rigRollRadians : walkConfig.rollRadians;
  const bobAmount = item.legRig ? walkConfig.rigBobInHeights : walkConfig.bobInHeights;
  const roll = Math.sin(state.phase) * rollAmount * state.weight;
  item.walkPivot.rotation.z = roll;
  let groundHeight;
  if (item.legRig) {
    applyLegPose(item.legRig, state.phase, state.weight, item.surface.maxSize);
    groundHeight = rigGroundHeight(item);
  } else {
    // 対応するリグがないモデルでは従来の全体揺れを維持する。
    let footY = Infinity;
    const sin = Math.sin(roll), cos = Math.cos(roll);
    for (const point of sharedFootContacts) footY = Math.min(footY, point.x * sin + point.y * cos);
    groundHeight = Number.isFinite(footY) ? -footY : 0;
  }
  const bob = (1 - Math.cos(state.phase * 2)) * 0.5 * item.surface.maxSize * bobAmount * state.weight;
  item.walkPivot.position.y = groundHeight + bob;
}

// race.htmlと同じ構成の位相制御・補間・脚姿勢・接地処理。
// 将来共通化する際は設定と個体状態を渡せる単位に分けてあり、移動処理には依存しない。
const motionEase = t => t*t*t*(t*(t*6-15)+10); // 端で速度・加速度が0になる五次補間
function motionBump(u) {
  // 素早く持ち上げ、少し長くかけて下ろす。頂点でも滑らかにつながる。
  return u<.42 ? motionEase(u/.42) : 1-motionEase((u-.42)/.58);
}
function resetWalkMotion(item) {
  const feature=salt=>{
    const value=Math.sin(item.id*12.9898+salt*78.233)*43758.5453;
    return (value-Math.floor(value))*2-1;
  };
  const amount=THREE.MathUtils.clamp(pastureMotionConfig.individuality,0,1);
  item.walkMotion={
    profile:{stride:1+feature(1)*.16*amount,lift:1+feature(2)*.24*amount,
      sway:1+feature(3)*.30*amount,bounce:1+feature(4)*.30*amount,
      asymmetry:feature(5)*.045*amount,offset:feature(6)*Math.PI*amount},
    phase:item.behavior.phase, speed:0, roll:0, pitch:0, shift:0, bob:0,
    resting:false, runBlend:0, settings:{...pastureMotionConfig.walk,smoothSeconds:pastureMotionConfig.smoothSeconds,rhythmVariation:pastureMotionConfig.rhythmVariation}
  };
  item.walkPivot.rotation.set(0,0,0);item.walkPivot.position.set(0,0,0);
}
function applyOrganicLegPose(item,weight) {
  const motion=item.walkMotion,config=motion.settings,profile=motion.profile;
  const speedRatio=THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*config.referenceSpeed),0,1.6);
  const effort=.78+.22*speedRatio;
  for(let i=0;i<item.legRig.legs.length;i++) {
    const leg=item.legRig.legs[i],side=i===0?1:-1;
    const cycle=((motion.phase/(Math.PI*2)+i*.5)%1+1)%1;
    const stance=THREE.MathUtils.clamp(config.stanceRatio+side*profile.asymmetry*.2,.52,.68);
    let hip,knee,lift,toe;
    const amplitude=config.hipSwing*effort*THREE.MathUtils.clamp(config.stride*profile.stride,.65,1.4)*(1+side*profile.asymmetry);
    if(cycle<stance) {
      const u=cycle/stance;
      // 足を前に置き、接地して後ろへ押す。接地の出入りは連続した速度でつなぐ。
      const push=u-Math.sin(u*Math.PI*2)/(Math.PI*2);
      hip=amplitude*(push*2-1);
      knee=.025*Math.sin(Math.PI*u)**2;
      lift=0;
      toe=u>.65 ? .055*motionBump((u-.65)/.35) : 0;
    } else {
      const u=(cycle-stance)/(1-stance),arc=motionBump(u);
      hip=amplitude*(1-2*motionEase(u));
      knee=config.kneeBend*arc*effort;
      lift=item.surface.maxSize*config.footLift*profile.lift*arc;
      toe=.045*Math.sin(u*Math.PI*2)*Math.sin(u*Math.PI)**2;
    }
    setJointAngle(leg.hip,hip*weight);setJointAngle(leg.knee,knee*weight);
    setJointAngle(leg.foot,(-hip-knee+toe)*weight);
    leg.hip.bone.position.copy(leg.restPosition).addScaledVector(leg.up,lift*weight);
  }
}
function updateWalkVisual(item,distance,dt) {
  if(pastureMotionConfig.mode==='classic' || !item.legRig) {
    updateClassicWalkVisual(item,distance,dt);return;
  }
  if(!item.walkMotion)resetWalkMotion(item);
  const motion=item.walkMotion,profile=motion.profile,config=motion.settings,state=item.behavior;
  // 待機姿勢に戻りきった個体は足裏計算も休む。向きのY回転は接地高さに影響しない。
  if(distance===0 && motion.resting && state.weight===0)return;
  motion.resting=false;
  const smoothing=Math.max(.025,config.smoothSeconds);
  const blend=1-Math.exp(-dt/smoothing);
  const measuredSpeed=dt>0 ? distance/dt : 0;
  motion.speed+=(measuredSpeed-motion.speed)*blend;
  const range=pastureMotionConfig.runSpeedRange;
  motion.runBlend=motionEase(THREE.MathUtils.clamp((motion.speed/item.surface.maxSize-range[0])/Math.max(.01,range[1]-range[0]),0,1));
  // 状態名ではなく実測速度で補間。自由歩行→集合→停止でも位相と個体差を保つ。
  for(const key of motionParameterKeys)config[key]=THREE.MathUtils.lerp(pastureMotionConfig.walk[key],pastureMotionConfig.run[key],motion.runBlend);
  state.weight+=((distance>0?1:0)-state.weight)*blend;
  if(distance===0 && state.weight<.001) { state.weight=0;motion.speed=0; }
  // 位相は積算し続ける。速度や歩幅が変わっても現在の足の姿勢を飛ばさない。
  const breathing=1+config.rhythmVariation*Math.sin(motion.phase*.23+profile.offset);
  // 高速域では歩幅も少し伸ばし、足だけが極端な高速回転にならないようにする。
  const speedStride=1+.35*THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*config.referenceSpeed)-1,0,1.8);
  const contactRatio=THREE.MathUtils.clamp(config.stanceRatio,.52,.68);
  // 接地を長くした分は1周期の距離を短くし、足が地面を押す速度と前進を近づける。
  const stride=item.legRig.strideLength*Math.max(.6,config.stride)*profile.stride*breathing*speedStride*(.5/contactRatio);
  motion.phase+=motion.speed*dt/stride*Math.PI*2;
  state.phase=motion.phase;
  applyOrganicLegPose(item,state.weight);
  const lagPhase=motion.phase-config.bodyLag;
  const effort=THREE.MathUtils.clamp(motion.speed/(item.surface.maxSize*config.referenceSpeed),0,1.4);
  const roll=-Math.cos(lagPhase)*config.sway*profile.sway*state.weight;
  const pitch=(config.forwardLean*effort+.008*Math.sin(lagPhase*2))*state.weight;
  const shift=Math.cos(lagPhase)*config.lateralShift*item.surface.maxSize*profile.sway*state.weight;
  const bob=(.5-.5*Math.cos(lagPhase*2))*config.bounce*item.surface.maxSize*profile.bounce*state.weight;
  // 大きな頭は足の切替へ少し遅れて追従。Bodyボーンは動かさず、顔ごと親を動かす。
  motion.roll+=(roll-motion.roll)*blend;motion.pitch+=(pitch-motion.pitch)*blend;
  motion.shift+=(shift-motion.shift)*blend;motion.bob+=(bob-motion.bob)*blend;
  if(state.weight===0) { motion.roll=0;motion.pitch=0;motion.shift=0;motion.bob=0; }
  item.walkPivot.rotation.set(motion.pitch,0,motion.roll);
  item.walkPivot.position.x=motion.shift;
  item.walkPivot.position.y=rigGroundHeight(item)+motion.bob;
  motion.resting=state.weight===0;
}

function updateFreeWalk(item, dt) {
  const state = item.behavior;
  state.remaining -= dt;
  if (state.remaining <= 0) {
    if (state.state === 'idle') {
      state.state = 'walking';
      state.remaining = randomBetween(walkConfig.walkSeconds);
      state.heading = Math.random() * Math.PI * 2;
    } else {
      state.state = 'idle';
      state.remaining = randomBetween(walkConfig.idleSeconds);
    }
  }
  if (state.state === 'idle') { updateWalkVisual(item, 0, dt); return; }
  const position = item.group.position;
  let desiredX = Math.sin(state.heading), desiredZ = Math.cos(state.heading);
  const margin = item.surface.maxSize * walkConfig.boundaryTurnInHeights;
  const minX = walkBounds.minX + item.radius, maxX = walkBounds.maxX - item.radius;
  const minZ = walkBounds.minZ + item.radius, maxZ = walkBounds.maxZ - item.radius;
  // 境界へ向かうほど内向きの成分を強め、角でもなめらかに引き返す。
  desiredX += 3 * Math.max(0, (minX + margin - position.x) / margin);
  desiredX -= 3 * Math.max(0, (position.x - maxX + margin) / margin);
  desiredZ += 3 * Math.max(0, (minZ + margin - position.z) / margin);
  desiredZ -= 3 * Math.max(0, (position.z - maxZ + margin) / margin);
  gatherWalkNeighbors(item);
  for (const other of state.neighbors) {
    let dx = position.x - other.group.position.x, dz = position.z - other.group.position.z;
    let distance = Math.hypot(dx, dz);
    const avoid = item.radius + other.radius + item.surface.maxSize * walkConfig.avoidanceInHeights;
    if (distance >= avoid) continue;
    if (distance < 1e-8) { dx = item.id < other.id ? -1 : 1; dz = 0; distance = 1; }
    const strength = 3 * Math.max(0.2, 1 - distance / avoid);
    desiredX += dx / distance * strength;
    desiredZ += dz / distance * strength;
  }
  const target = Math.atan2(desiredX, desiredZ);
  const difference = Math.atan2(Math.sin(target - item.group.rotation.y), Math.cos(target - item.group.rotation.y));
  item.group.rotation.y += THREE.MathUtils.clamp(difference,
    -walkConfig.turnRadiansPerSecond * dt, walkConfig.turnRadiansPerSecond * dt);
  item.group.rotation.y = Math.atan2(Math.sin(item.group.rotation.y), Math.cos(item.group.rotation.y));
  // 大きな方向転換中は進みを弱める。実際の移動は体の正面方向だけ。
  const step = state.speed * dt * Math.max(0, Math.cos(difference));
  const nextX = THREE.MathUtils.clamp(position.x + Math.sin(item.group.rotation.y) * step, minX, maxX);
  const nextZ = THREE.MathUtils.clamp(position.z + Math.cos(item.group.rotation.y) * step, minZ, maxZ);
  let blocked = false;
  for (const other of state.neighbors) {
    const clearance = item.radius + other.radius;
    const nextDistance = Math.hypot(nextX - other.group.position.x, nextZ - other.group.position.z);
    const oldDistance = Math.hypot(position.x - other.group.position.x, position.z - other.group.position.z);
    if (nextDistance < clearance && nextDistance <= oldDistance) { blocked = true; break; }
  }
  const distance = blocked ? 0 : Math.hypot(nextX - position.x, nextZ - position.z);
  if (!blocked) { position.x = nextX; position.z = nextZ; }
  updateWalkVisual(item, distance, dt);
}

function updatePastureCharacters(dt) {
  if (!walkingReady || dt <= 0) return;
  if (gathering) { updateGather(dt); return; }
  walkGrid.clear();
  for (const item of pastureCharacters) {
    const key = `${Math.floor(item.group.position.x / walkCellSize)},${Math.floor(item.group.position.z / walkCellSize)}`;
    let bucket = walkGrid.get(key);
    if (!bucket) { bucket = []; walkGrid.set(key, bucket); }
    bucket.push(item);
  }
  for (const item of pastureCharacters) {
    // 自由歩行では従来の境界・近隣回避を使用。
    if (item.behavior.mode === 'free') updateFreeWalk(item, dt);
    else updateWalkVisual(item, 0, dt);
  }
}

function arrangeCharacters(characters) {
  const columns = Math.min(6, Math.ceil(Math.sqrt(characters.length)));
  const rows = Math.ceil(characters.length / columns);
  const maxSize = Math.max(...characters.map((c) => c.surface.maxSize));
  const widest = Math.max(...characters.map((c) => c.surface.size.x));
  const spacingX = Math.max(widest * 1.8, maxSize * 1.8);
  const spacingZ = maxSize * 1.9;
  for (let i = 0; i < characters.length; i++) {
    const row = Math.floor(i / columns), column = i % columns;
    const rowCount = Math.min(columns, characters.length - row * columns);
    characters[i].group.position.set((column - (rowCount - 1) / 2) * spacingX,
      0, ((rows - 1) / 2 - row) * spacingZ);
    // 全個体は正面の+Z側（初期カメラ側）を向く。
    characters[i].group.rotation.y = 0;
  }
  ground.scale.set(Math.max(maxSize * 16, columns * spacingX + maxSize * 8),
    Math.max(maxSize * 16, rows * spacingZ + maxSize * 8), 1);
  const bounds = new THREE.Box3();
  for (const item of characters) bounds.expandByObject(item.group);
  return bounds;
}

function fitCamera(bounds) {
  const sphere = bounds.getBoundingSphere(new THREE.Sphere());
  const verticalFov = THREE.MathUtils.degToRad(camera.fov);
  const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
  const distance = sphere.radius / Math.sin(Math.min(verticalFov, horizontalFov) / 2) * 1.15;
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(new THREE.Vector3(0, 0.75, 1).normalize(), distance);
  camera.near = Math.max(sphere.radius / 1000, 0.001);
  camera.far = Math.max(1000, distance * 20);
  camera.updateProjectionMatrix();
  controls.minDistance = sphere.radius * 0.35;
  controls.maxDistance = distance * 8;
  controls.update();
}

async function populatePasture() {
  try {
    const records = readRegisteredCharacters();
    if (records.length === 0) {
      status.textContent = 'まだ牧場には誰もいません';
      return;
    }
    status.textContent = `${records.length}体のぶさかわを読み込み中…`;
    const requiredParts = new Set();
    for (const record of records) {
      for (const slot of partSlots) {
        const saved = record.parts[slot];
        if (saved?.exists === true) requiredParts.add(saved.type);
      }
    }
    const character = await loadTemplate('./assets/characters/tousokujin.glb');
    const parts = new Map(await Promise.all([...requiredParts].map(async (type) =>
      [type, await loadTemplate(partSettings[type].path)])));
    for (let i = 0; i < records.length; i++) {
      const item = createPastureCharacter(records[i], { character, parts });
      pastureCharacters.push(item);
      scene.add(item.group);
      item.modelSpace.traverse(mesh => { if(mesh.isMesh) { pickMeshes.push(mesh); meshOwners.set(mesh,item); } });
      status.textContent = `${i + 1} / ${records.length}体を配置中…`;
      if (i % 4 === 3) await new Promise((resolve) => setTimeout(resolve, 0));
    }
    arrangeCharacters(pastureCharacters);
    currentBounds = initializeWalking(pastureCharacters);
    fitCamera(currentBounds);
    gatherButton.disabled = false;
    status.textContent = `${pastureCharacters.length}体のぶさかわが暮らしているよ`;
  } catch (error) {
    console.error(error);
    // 途中で失敗しても、復元済みの個体は見渡せる配置にする。
    if (pastureCharacters.length) {
      arrangeCharacters(pastureCharacters);
      currentBounds = initializeWalking(pastureCharacters);
      fitCamera(currentBounds);
    }
    status.textContent = error instanceof Error && !error.message.startsWith('Failed to fetch')
      ? `牧場を準備できなかったよ。${error.message}`
      : 'モデルを読み込めなかったよ。ローカルサーバーとモデルの保存先を確認してね。';
  } finally {
    entrantSelection.ready = true;
    restoreEntrantSelection();
    renderEntrantSelection();
  }
}
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (currentBounds) fitCamera(currentBounds);
});
let lastFrameTime;
function animate(now) {
  requestAnimationFrame(animate);
  // タブを戻したときや描画が遅れたときも、遠くへ飛ばないよう上限を設ける。
  const dt = lastFrameTime === undefined || now === undefined ? 0 :
    Math.min(walkConfig.maxDeltaSeconds, Math.max(0, (now - lastFrameTime) / 1000));
  lastFrameTime = now;
  updatePastureCharacters(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
populatePasture();
  </script>
</body>
</html>
