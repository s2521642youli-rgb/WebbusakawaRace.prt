body{margin:0;background:#f4f6ee;color:#304734;font-family:sans-serif}main{max-width:560px;margin:auto;padding:22px 16px}h1{font-size:24px}#timer{font-size:30px;font-weight:bold;font-variant-numeric:tabular-nums}.card{background:white;padding:16px;margin:12px 0;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card p{margin:4px 0}button{border:0;border-radius:9px;background:#ffdf83;color:#304734;font:inherit;font-weight:bold;padding:14px 18px;min-height:48px}button:disabled{opacity:.5}#message{min-height:2.8em;font-weight:bold}#connection{color:#98521b}small{overflow-wrap:anywhere}#results{padding-left:0;list-style:none;line-height:1.8}
