<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ぶさかわレース</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #eeeeee;
    }

    #message {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: sans-serif;
    }

    #eyeControls {
      position: absolute;
      top: 60px;
      left: 20px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      font-family: sans-serif;
      z-index: 10;
      width: 220px;
    }

    #eyeControls h3 {
      margin-top: 0;
    }

    #eyeControls input {
      width: 100%;
    }

    .controlRow {
      margin-bottom: 15px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<div id="message">読み込み中...</div>

<!-- 目の位置調整 -->
<div id="eyeControls">

  <h3>目の位置調整</h3>

  <div class="controlRow">
    <label>
      左右（X）：
      <span id="eyeXValue">-0.40</span>
    </label>

    <input
      type="range"
      id="eyeX"
      min="-0.75"
      max="0.75"
      step="0.01"
      value="-0.4"
    >
  </div>

  <div class="controlRow">
    <label>
      上下（Y）：
      <span id="eyeYValue">0.10</span>
    </label>

    <input
      type="range"
      id="eyeY"
      min="-0.65"
      max="0.65"
      step="0.01"
      value="0.1"
    >
  </div>

  <div class="controlRow">
    <label>
      浮き具合（eye_01固定）：
      <span id="eyeDepthValue">-0.10</span>
    </label>

    <input
      type="range"
      id="eyeDepth"
      min="-0.15"
      max="0.15"
      step="0.01"
      value="-0.10"
      disabled
    >
  </div>

</div>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


// ========================================
// 基本設定
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xeeeeee);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// ライト
// ========================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x888888,
    2
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(3, 5, 5);

scene.add(light);


// ========================================
// カメラ操作
// ========================================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;


// ========================================
// モデル読み込み
// ========================================

const loader = new GLTFLoader();

let character;
let leftEye;


// ========================================
// 頭足人を読み込む
// ========================================

loader.load(

  './assets/characters/tousokujin.glb',

  (gltf) => {

    character = gltf.scene;

    scene.add(character);


    // ========================================
    // モデルの大きさ
    // ========================================

    const box = new THREE.Box3().setFromObject(character);

    const center = box.getCenter(
      new THREE.Vector3()
    );

    const size = box.getSize(
      new THREE.Vector3()
    );

    const maxSize = Math.max(
      size.x,
      size.y,
      size.z
    );


    // ========================================
    // カメラ位置
    // ========================================

    camera.position.set(
      center.x,
      center.y + maxSize * 0.3,
      center.z + maxSize * 2.5
    );

    controls.target.copy(center);

    controls.update();


    // ========================================
    // 頭の位置を推定
    // ========================================

    const headRadius = Math.min(
      size.x * 0.48,
      size.y * 0.34
    );

    const headCenter = new THREE.Vector3(
      center.x,
      box.max.y - headRadius,
      center.z
    );


    // 球の半径は既存のスライダーの尺度・目のサイズにだけ使う。
    // 配置先は頭足人の実際のメッシュ表面から取得する。
    const characterMeshes = [];
    character.traverse((object) => {
      if (object.isMesh) characterMeshes.push(object);
    });

    const raycaster = new THREE.Raycaster();
    const rayDirection = new THREE.Vector3(0, 0, -1);
    const forward = new THREE.Vector3(0, 0, 1);
    const surfaceNormal = new THREE.Vector3();
    const vertexA = new THREE.Vector3();
    const vertexB = new THREE.Vector3();
    const vertexC = new THREE.Vector3();
    const edgeAB = new THREE.Vector3();
    const edgeAC = new THREE.Vector3();
    const clearance = maxSize * 0.001;
    const headMinY = headCenter.y - headRadius;

    function refreshCharacterMatrices() {
      character.updateMatrixWorld(true);
      characterMeshes.forEach((mesh) => {
        if (mesh.isSkinnedMesh) mesh.skeleton.update();
      });
    }

    function findHeadSurface(worldX, worldY) {
      if (worldY < headMinY || worldY > box.max.y) return null;
      raycaster.set(
        new THREE.Vector3(worldX, worldY, box.max.z + maxSize),
        rayDirection
      );
      raycaster.near = 0;
      raycaster.far = size.z + maxSize * 2;
      return raycaster.intersectObjects(characterMeshes, false)
        .find((hit) => hit.face && hit.point.y >= headMinY) || null;
    }

    // ========================================
    // 目のモデルを読み込む
    // ========================================

    loader.load(

      './assets/eyes/eye_01.glb',

      (eyeGltf) => {

        leftEye = eyeGltf.scene;


        // --------------------------------
        // 目の元の大きさ
        // --------------------------------

        const eyeBox = new THREE.Box3().setFromObject(
          leftEye
        );

        const eyeSize = eyeBox.getSize(
          new THREE.Vector3()
        );

        const maxEyeSize = Math.max(
          eyeSize.x,
          eyeSize.y,
          eyeSize.z
        );

        if (maxEyeSize <= 0) {

          document.getElementById('message').textContent =
            '目のモデルの大きさを取得できませんでした';

          return;
        }


        // --------------------------------
        // 目の大きさを調整
        // --------------------------------

        const targetEyeSize = headRadius * 0.48;

        const scale = targetEyeSize / maxEyeSize;

        leftEye.scale.multiplyScalar(scale);


        // --------------------------------
        // 目の中心を原点に合わせる
        // --------------------------------

        const scaledBox = new THREE.Box3().setFromObject(
          leftEye
        );

        const eyeCenter = scaledBox.getCenter(
          new THREE.Vector3()
        );

        const scaledEyeSize = scaledBox.getSize(
          new THREE.Vector3()
        );

        leftEye.position.sub(eyeCenter);


        // ========================================
        // 目の位置調整用グループ
        // ========================================

        const eyeGroup = new THREE.Group();

        eyeGroup.add(leftEye);

        scene.add(eyeGroup);


        // ========================================
        // スライダー取得
        // ========================================

        const eyeXSlider = document.getElementById('eyeX');

        const eyeYSlider = document.getElementById('eyeY');

        const eyeDepthSlider = document.getElementById('eyeDepth');

        // eye_01専用。既存スライダー尺度で内側へ0.1沈める。
        const fixedEyeDepth = -0.1;


        // ========================================
        // ★ 目の位置・角度を更新する
        // ========================================

        // 中心合わせ後の取り付け原点から、目の後端までの距離。
        eyeGroup.updateMatrixWorld(true);
        const centeredEyeBox = new THREE.Box3().setFromObject(eyeGroup);
        const rearDepth = Math.max(0, -centeredEyeBox.min.z);
        const eyeHalfWidth = scaledEyeSize.x * 0.5;
        const eyeHalfHeight = scaledEyeSize.y * 0.5;

        // X・Yは既存スライダーと同じ尺度。ArUco側で座標を変換して渡せる。
        // 成功ならtrue、未検出・不正入力ならfalse。最後の有効姿勢を維持する。
        function updateEyePosition(x, y, depth = 0) {
          if (![x, y, depth].every(Number.isFinite)) return false;

          refreshCharacterMatrices();
          const hit = findHeadSurface(
            headCenter.x + headRadius * x,
            headCenter.y + headRadius * y
          );

          if (!hit) {
            document.getElementById('message').textContent =
              'この位置には頭の表面がないよ。目は最後の有効位置を維持しているよ';
            return false;
          }

          // getVertexPositionはSkinnedMeshのボーン変形も反映する。
          // 変形済み三角形をワールド座標へ移し、その表面法線を求める。
          const mesh = hit.object;
          mesh.getVertexPosition(hit.face.a, vertexA).applyMatrix4(mesh.matrixWorld);
          mesh.getVertexPosition(hit.face.b, vertexB).applyMatrix4(mesh.matrixWorld);
          mesh.getVertexPosition(hit.face.c, vertexC).applyMatrix4(mesh.matrixWorld);
          edgeAB.subVectors(vertexB, vertexA);
          edgeAC.subVectors(vertexC, vertexA);
          surfaceNormal.crossVectors(edgeAB, edgeAC);
          if (surfaceNormal.lengthSq() < 1e-20) return false;
          surfaceNormal.normalize();
          if (surfaceNormal.dot(rayDirection) > 0) surfaceNormal.negate();

          const orientation = new THREE.Quaternion()
            .setFromUnitVectors(forward, surfaceNormal);

          // 後端の面を覆う3×3点でも表面を確認し、曲面の盛り上がりを補正。
          // 複雑な凹凸や輪郭の外では追加点の交点が得られないこともある。
          let surfaceRise = 0;
          const sampleOffset = new THREE.Vector3();
          const sampleOrigin = new THREE.Vector3();
          const sampleDirection = surfaceNormal.clone().negate();
          for (let ix = -1; ix <= 1; ix++) {
            for (let iy = -1; iy <= 1; iy++) {
              sampleOffset.set(ix * eyeHalfWidth, iy * eyeHalfHeight, 0)
                .applyQuaternion(orientation);
              sampleOrigin.copy(hit.point).add(sampleOffset)
                .addScaledVector(surfaceNormal, maxSize);
              raycaster.set(sampleOrigin, sampleDirection);
              raycaster.near = 0;
              raycaster.far = maxSize * 2;
              const sampleHit = raycaster.intersectObjects(characterMeshes, false)
                .find((candidate) => candidate.point.y >= headMinY);
              if (sampleHit) {
                const rise = sampleHit.point.clone().sub(hit.point).dot(surfaceNormal);
                surfaceRise = Math.max(surfaceRise, rise);
              }
            }
          }

          const minimumOffset = rearDepth + surfaceRise + clearance;
          // eye_01の沈み量は、スライダーや外部入力に関係なく固定。
          const offset = minimumOffset + headRadius * fixedEyeDepth;
          eyeGroup.position.copy(hit.point).addScaledVector(surfaceNormal, offset);
          eyeGroup.quaternion.copy(orientation);
          eyeGroup.visible = true;
          document.getElementById('message').textContent =
            '目のX・Yを調整できるよ！eye_01の浮き具合は-0.1で固定しているよ';
          return true;
        }

        function updateEyeFromSliders() {
          const x = Number(eyeXSlider.value);
          const y = Number(eyeYSlider.value);
          const depth = fixedEyeDepth;
          document.getElementById('eyeXValue').textContent = x.toFixed(2);
          document.getElementById('eyeYValue').textContent = y.toFixed(2);
          document.getElementById('eyeDepthValue').textContent = depth.toFixed(2);
          return updateEyePosition(x, y, depth);
        }

        // 外部入力用。例: window.setEyeCoordinates(-0.4, 0.1)
        // eye_01では第3引数を渡しても沈み量は-0.1で固定。
        // ArUcoのピクセル座標は、呼び出し側でこのX・Y尺度へ変換する。
        window.setEyeCoordinates = updateEyePosition;
        eyeGroup.visible = false;

        // ========================================
        // スライダー操作
        // ========================================

        eyeXSlider.addEventListener(
          'input',
          updateEyeFromSliders
        );

        eyeYSlider.addEventListener(
          'input',
          updateEyeFromSliders
        );

        eyeDepthSlider.addEventListener(
          'input',
          updateEyeFromSliders
        );


        // 初期位置を設定
        updateEyeFromSliders();

      },

      undefined,

      (error) => {

        console.error(error);

        document.getElementById('message').textContent =
          '目の読み込みに失敗しました';

      }

    );

  },

  undefined,

  (error) => {

    console.error(error);

    document.getElementById('message').textContent =
      '頭足人の読み込みに失敗しました';

  }

);


// ========================================
// ウィンドウサイズ変更
// ========================================

window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});


// ========================================
// 描画
// ========================================

function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene, camera);

}

animate();

</script>

</body>
</html>
