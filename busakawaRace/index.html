<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ぶさかわレース</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #eeeeee;
      font-family: sans-serif;
    }

    #message {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    #partControls {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 220px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      z-index: 10;
    }

    #partControls h3 {
      margin-top: 0;
    }

    #partControls input {
      width: 100%;
    }

    #characterActions button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      background: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    #characterActions #registerCharacter {
      background: #ffdf83;
      font-weight: bold;
    }

    #characterActions button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .controlRow {
      margin-bottom: 15px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section + .section {
      padding-top: 15px;
      border-top: 1px solid #dddddd;
    }

    label {
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #777777;
    }
    [hidden] { display: none !important; }
    .choiceGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:10px 0; }
    .choiceGrid button, #resetPart { padding:10px 6px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; }
    .choiceGrid button[aria-pressed="true"] { background:#ffdf83; border-color:#b78822; font-weight:bold; }
    #categoryChoices button { font-size:18px; }
    #modelChoices { max-height:150px; overflow:auto; }
    #partControls details { margin-top:14px; border-top:1px solid #ddd; padding-top:12px; }
    #partControls summary { cursor:pointer; }
    #partControls input[type="checkbox"] { width:auto; }
    .controlRow { margin-bottom:10px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<div id="message">読み込み中...</div>

<!-- ========================================
     パーツ調整UI
======================================== -->

<div id="partControls">

  <div class="section" id="characterActions">
    <button type="button" id="registerCharacter">この子を登録する！</button>
    <button type="button" id="viewRanch">牧場を見る</button>
    <p id="registrationStatus" role="status" aria-live="polite"></p>
  </div>

  <div id="categoryChoices" class="choiceGrid" aria-label="カテゴリ"></div>
  <div id="slotChoices" class="choiceGrid" aria-label="編集する場所"></div>
  <p class="note">編集する場所を選んでから、使うモデルを選んでね。</p>
  <div id="modelChoices" class="choiceGrid" aria-label="使うモデル"></div>
  <p id="partStatus" class="note" role="status"></p>
  <div id="selectedEditor"></div>
  <button id="resetPart" type="button">位置・角度・大きさ・傾きをリセット</button>
  <details><summary>ArUco連携の設定</summary>
    <h3>ArUco連携</h3>
    <label><input type="checkbox" id="arucoEnabled"
      style="width: auto;"> マーカーの動きを反映する</label>
    <p id="arucoStatus" class="note" role="status">接続準備中</p>
    <p class="note">初期状態は手動操作。ONでマーカーを反映するよ。モデルを選ぶと手動プレビューに戻るよ。</p>
  </details>

  <!-- 目 -->
  <div class="section">

    <h3>目①の調整</h3>

    <div class="controlRow">
      <label>
        左右（X）：
        <span id="eyeXValue">-0.40</span>
      </label>

      <input
        type="range"
        id="eyeX"
        min="-0.75"
        max="0.75"
        step="0.01"
        value="-0.4"
      >
    </div>

    <div class="controlRow">
      <label>
        上下（Y）：
        <span id="eyeYValue">0.10</span>
      </label>

      <input
        type="range"
        id="eyeY"
        min="-0.65"
        max="0.65"
        step="0.01"
        value="0.1"
      >
    </div>

    <div class="controlRow">
      <label for="eyeRotation">回転：<span id="eyeRotationValue">0</span>°</label>
      <input type="range" id="eyeRotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>
        浮き具合：
        <span id="eyeDepthValue">-0.10</span>
      </label>

      <input id="eyeDepth"
        type="range"
        min="-0.50"
        max="0.50"
        step="0.01"
        value="-0.10"
      >
    </div>

  </div>

  <!-- 2つ目の目：計測済み座標の仮データを初期値にする -->
  <div class="section">

    <h3>2つ目の目（eye_02）</h3>

    <div class="controlRow">
      <label>左右（X）：<span id="eye02XValue">0.40</span></label>
      <input type="range" id="eye02X"
        min="-0.75" max="0.75" step="0.01" value="0.4">
    </div>

    <div class="controlRow">
      <label>上下（Y）：<span id="eye02YValue">0.10</span></label>
      <input type="range" id="eye02Y"
        min="-0.65" max="0.65" step="0.01" value="0.1">
    </div>

    <div class="controlRow">
      <label for="eye02Rotation">回転：<span id="eye02RotationValue">0</span>°</label>
      <input type="range" id="eye02Rotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>浮き具合：<span id="eye02DepthValue">-0.10</span></label>
      <input type="range" id="eye02Depth"
        min="-0.50" max="0.50" step="0.01" value="-0.10" disabled>
    </div>

    <p class="note">初期位置は計測済み座標の仮データ。X・Yで調整できるよ。</p>

  </div>

  <!-- 口 -->
  <div class="section">

    <h3>口の位置調整</h3>

    <div class="controlRow">
      <label>
        左右（X）：
        <span id="mouthXValue">0.00</span>
      </label>

      <input
        type="range"
        id="mouthX"
        min="-0.75"
        max="0.75"
        step="0.01"
        value="0"
      >
    </div>

    <div class="controlRow">
      <label>
        上下（Y）：
        <span id="mouthYValue">-0.35</span>
      </label>

      <input
        type="range"
        id="mouthY"
        min="-0.65"
        max="0.65"
        step="0.01"
        value="-0.35"
      >
    </div>

    <div class="controlRow">
      <label for="mouthRotation">回転：<span id="mouthRotationValue">0</span>°</label>
      <input type="range" id="mouthRotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>
        浮き具合：
        <span id="mouthDepthValue">0.00</span>
      </label>

      <input
        type="range"
        id="mouthDepth"
        min="-0.50"
        max="0.50"
        step="0.01"
        value="-0.10"
       >
    </div>

    <p class="note">
      マイナス：頭に埋め込む<br>
      プラス：頭から浮かせる
    </p>

  </div>

</div>


<script type="module">

import {partSettings,partSlots,partCategories,slotDefinitions,arucoMarkerBindings,markerSetters} from './js/parts-config.js';
import {createModelCache} from './js/model-cache.js';
import {partAdjustmentConfig,readPartAdjustment,adjustedPartBounds,applyPartAdjustment} from './js/part-adjustment.js';
import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


// ========================================
// 基本設定
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xeeeeee);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// ライト
// ========================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x888888,
    2
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(3, 5, 5);

scene.add(light);


// ========================================
// カメラ操作
// ========================================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;


// ========================================
// 共通変数
// ========================================

const loader = new GLTFLoader();

const message = document.getElementById('message');

let character;

let headRadius;
let headCenter;
let characterBox;
let maxSize;

let characterMeshes = [];

const raycaster = new THREE.Raycaster();

const rayDirection = new THREE.Vector3(0, 0, -1);

const forward = new THREE.Vector3(0, 0, 1);

let headMinY;


// ========================================
// パーツごとの設定
// ========================================

// モデル・スロット・マーカーの定義はjs/parts-config.jsを参照。


const slotChoices=Object.fromEntries(Object.entries(slotDefinitions).map(([slot,definition])=>[slot,{...definition,enabled:true}]));
const partEditors = new Map();
const loadCachedTemplate=createModelCache(loader);
function loadPartTemplate(type){return loadCachedTemplate(partSettings[type].path);}
let selectedCategory = 'eyes', selectedSlot = 'eye_01';
const partStatus = document.getElementById('partStatus');
const editorPanels = {};
const adjustmentControls={};
function makeAdjustmentControl(panel,slot,key,label){
  const config=partAdjustmentConfig[key],row=document.createElement('div'),text=document.createElement('label'),value=document.createElement('span'),input=document.createElement('input');
  row.className='controlRow';input.type='range';input.id=slot+'_'+key;
  input.min=String(config.min);input.max=String(config.max);input.step=String(config.step);input.value=String(config.initial);
  text.htmlFor=input.id;text.textContent=label+'：';value.textContent=key==='scale'?'1.00倍':'0°';text.append(value);row.append(text,input);panel.append(row);
  if(key==='tilt')input.title='＋：上側が手前／−：下側が手前。頭の表面に沿った向きから傾ける';
  return {input,value,row};
}
for (const [slot, definition] of Object.entries(slotDefinitions)) {
  const slider=definition.sliders[0];
  const panel = document.getElementById(slider).closest('.section');
  editorPanels[slot] = panel;
  adjustmentControls[slot]={scale:makeAdjustmentControl(panel,slot,'scale','大きさ'),tilt:makeAdjustmentControl(panel,slot,'tilt','前後の傾き')};
  document.getElementById('selectedEditor').append(panel);
}
function choiceButton(label, selected, action) {
  const button = document.createElement('button');
  button.type = 'button'; button.textContent = label;
  button.setAttribute('aria-pressed', String(selected));
  button.addEventListener('click', action);
  return button;
}
function renderPartEditor() {
  document.getElementById('categoryChoices').replaceChildren(...Object.entries(partCategories).map(([key, category]) =>
    choiceButton(category.label, key === selectedCategory, () => {
      selectedCategory = key; selectedSlot = category.slots[0]; renderPartEditor();
    })));
  const category = partCategories[selectedCategory];
  document.getElementById('slotChoices').replaceChildren(...category.slots.map(slot =>
    choiceButton(slotChoices[slot].label, slot === selectedSlot, () => { selectedSlot = slot; renderPartEditor(); })),
    choiceButton(category.label + 'なし', category.slots.every(slot => !slotChoices[slot].enabled), () => {
      category.slots.forEach(slot => { slotChoices[slot].enabled = false; slotChoices[slot].revision = (slotChoices[slot].revision ?? 0) + 1; }); updateArucoVisibility(); renderPartEditor();
    }));
  const choice = slotChoices[selectedSlot];
  document.getElementById('modelChoices').replaceChildren(
    choiceButton('なし', !choice.enabled, () => { choice.enabled = false; choice.revision = (choice.revision ?? 0) + 1; updateArucoVisibility(); renderPartEditor(); }),
    ...category.models.map(type => choiceButton(partSettings[type].label, choice.enabled && choice.type === type, async () => {
      const editor = partEditors.get(selectedSlot);
      if (!editor) { partStatus.textContent = 'モデルを読み込み中だよ。少し待ってね。'; return; }
      await editor.selectModel(type);
      renderPartEditor();
    })));
  for (const [slot, panel] of Object.entries(editorPanels)) panel.hidden = slot !== selectedSlot;
}
document.getElementById('resetPart').addEventListener('click', () => partEditors.get(selectedSlot)?.reset());
renderPartEditor();

// 有効に配置できた状態だけを保持する。取得結果はコピーなので外部変更されない。
const facePartStates = {};
window.getFacePartStates = () => Object.fromEntries(
  Object.entries(facePartStates).map(([name, state]) => [name, { ...state }])
);

// ========================================
// キャラクター登録（保存先の差し替えはcharacterRepositoryにまとめる）
// ========================================
const characterStorageKey = 'busakawaRace.characters.v1';
const registerCharacterButton = document.getElementById('registerCharacter');
const registrationStatus = document.getElementById('registrationStatus');

function characterName(number) {
  return `ぶさかわ${String(number).padStart(3, '0')}`;
}

const characterRepository = {
  read() {
    const raw = localStorage.getItem(characterStorageKey);
    if (raw === null) return { schemaVersion: 1, nextNumber: 1, characters: [] };
    let data;
    try { data = JSON.parse(raw); } catch {
      throw new Error('保存データを読み取れないよ。既存のデータは変更していないよ。');
    }
    if (!data || data.schemaVersion !== 1 || !Array.isArray(data.characters) ||
        !Number.isSafeInteger(data.nextNumber) || data.nextNumber < 1) {
      throw new Error('保存データの形式が違うため登録できないよ。既存のデータは残してあるよ。');
    }
    const used = new Set();
    let maxNumber = 0;
    for (const record of data.characters) {
      if (!record || !Number.isSafeInteger(record.id) || record.id < 1 ||
          record.name !== characterName(record.id) || used.has(record.id)) {
        throw new Error('登録番号を確認できないよ。既存のデータは変更していないよ。');
      }
      used.add(record.id);
      maxNumber = Math.max(maxNumber, record.id);
    }
    data.nextNumber = Math.max(data.nextNumber, maxNumber + 1);
    return data;
  },

  async register(snapshot) {
    // 同一オリジンの別タブとも排他制御する。取得待ち中も顔データは変化しない。
    if (!navigator.locks?.request) {
      throw new Error('このブラウザでは登録番号を安全に管理できないよ。localhostを対応ブラウザで開いてね。');
    }
    return navigator.locks.request(characterStorageKey, () => {
      const data = this.read();
      const number = data.nextNumber;
      if (!Number.isSafeInteger(number + 1)) throw new Error('登録番号の上限に達したよ。');
      const record = {
        id: number,
        name: characterName(number),
        registeredAt: snapshot.registeredAt,
        parts: JSON.parse(JSON.stringify(snapshot.parts))
      };
      data.characters.push(record);
      data.nextNumber = number + 1;
      // 番号と全レコードを1回で保存。容量不足ならどちらも更新されない。
      localStorage.setItem(characterStorageKey, JSON.stringify(data));
      return record;
    });
  }
};

function captureCharacterSnapshot() {
  const bindings=Object.fromEntries(partSlots.map(slot=>[slot,slotDefinitions[slot].setter]));
  if (!character || Object.keys(bindings).some((part) => !facePartStates[part])) {
    throw new Error('モデルを読み込み中だよ。読み込みが終わってから登録してね。');
  }
  // 0.3秒の検出猶予も含めた、クリックした瞬間の表示状態を記録する。
  updateArucoVisibility();
  const parts = {};
  for (const [type, setterName] of Object.entries(bindings)) {
    const state = facePartStates[type];
    parts[type] = {
      type: slotChoices[type].type,
      depth: state.depth,
      scale: state.scale,
      tilt: state.tilt,
      x: state.x,
      y: state.y,
      rotation: state.rotation,
      exists: arucoPartGroups.get(setterName)?.visible === true
    };
  }
  return { registeredAt: new Date().toISOString(), parts };
}

registerCharacterButton.addEventListener('click', async () => {
  if (registerCharacterButton.disabled) return;
  registerCharacterButton.disabled = true;
  try {
    // 保存待ちの前にコピーする。その後のArUco操作と登録済みの顔は独立。
    const snapshot = captureCharacterSnapshot();
    const saved = await characterRepository.register(snapshot);
    registrationStatus.textContent = `${saved.name}を登録しました！`;
  } catch (error) {
    registrationStatus.textContent = error instanceof Error &&
      !['QuotaExceededError', 'SecurityError'].includes(error.name)
      ? error.message
      : '保存できなかったよ。ブラウザの保存設定や空き容量を確認してね。';
  } finally {
    registerCharacterButton.disabled = false;
  }
});

document.getElementById('viewRanch').addEventListener('click', () => {
  window.location.href = './pasture.html';
});

// ========================================
// ArUco WebSocket設定（キャリブレーションはここで変更）
// ========================================
const arucoConfig = {
  url: 'ws://127.0.0.1:8766',
  // マーカーID → 既存の配置関数名
  markerSetters,
  // check.pyの正規化座標は下が0・上が1。中心0.5を顔の中心に合わせる。
  centerX: 0.5,
  centerY: 0.5,
  scaleX: 1,
  scaleY: 1,
  offsetX: 0,
  offsetY: 0,
  flipX: true,
  flipY: false,
  rotationOffsetDeg: 0,
  lostGraceMs: 300,
  reconnectMs: 2000
};

const arucoEnabled = document.getElementById('arucoEnabled');
const arucoStatus = document.getElementById('arucoStatus');
const pendingArucoMarkers = new Map();
// 座標・角度の状態とは分けて表示を管理する。モデルは作り直さない。
const arucoPartGroups = new Map();
const arucoLastSeen = new Map();
const arucoPlacedParts = new Set();
let arucoSocket;
let arucoReconnectTimer;
let arucoStopped = false;
let arucoConnected = false;
let arucoFrameReceived = false;
let arucoDetectedCount = 0;

function updateArucoVisibility(now = performance.now()) {
  for (const [setterName, group] of arucoPartGroups) {
    const lastSeen = arucoLastSeen.get(setterName);
    const choice = Object.values(slotChoices).find(item => item.setter === setterName);
    group.visible = choice.enabled && (!arucoEnabled.checked || (
      arucoConnected && arucoPlacedParts.has(setterName) &&
      lastSeen !== undefined && now - lastSeen < arucoConfig.lostGraceMs
    ));
  }
}

function clearArucoTracking() {
  pendingArucoMarkers.clear();
  arucoLastSeen.clear();
  arucoPlacedParts.clear();
  updateArucoVisibility();
}

function updateArucoStatus() {
  if (!arucoEnabled.checked) {
    arucoStatus.textContent = '自動反映OFF：スライダーで調整できるよ';
  } else if (!arucoConnected) {
    arucoStatus.textContent = '未接続：パーツは非表示。自動反映OFFで手動操作できるよ';
  } else if (!arucoFrameReceived) {
    arucoStatus.textContent = '接続済み：検出データを待っているよ';
  } else {
    arucoStatus.textContent = `受信中：対象マーカー ${arucoDetectedCount}個（未検出は0.3秒後に非表示）`;
  }
}

function convertArucoMarker(marker) {
  let x = (marker.x_norm - arucoConfig.centerX) * 2 * 0.75 * arucoConfig.scaleX;
  let y = (marker.y_norm - arucoConfig.centerY) * 2 * 0.65 * arucoConfig.scaleY;
  let rotation = marker.rotation_ccw_deg;
  // 反転時は角度も同じ鏡映に合わせる。
  if (arucoConfig.flipX) { x = -x; rotation = -rotation; }
  if (arucoConfig.flipY) { y = -y; rotation = -rotation; }
  return {
    x: THREE.MathUtils.clamp(x + arucoConfig.offsetX, -0.75, 0.75),
    y: THREE.MathUtils.clamp(y + arucoConfig.offsetY, -0.65, 0.65),
    rotation: rotation + arucoConfig.rotationOffsetDeg
  };
}

function receiveArucoMessage(raw) {
  let data;
  try { data = JSON.parse(raw); } catch { return; }
  if (!data || data.type !== 'aruco_frame' || !Array.isArray(data.markers)) return;
  arucoFrameReceived = true;
  const valid = new Map();
  const duplicates = new Set();
  for (const marker of data.markers) {
    if (!marker || !Number.isInteger(marker.target_id) || marker.detected !== true ||
        !Object.hasOwn(arucoConfig.markerSetters, marker.target_id) ||
        ![marker.x_norm, marker.y_norm, marker.rotation_ccw_deg].every(Number.isFinite) ||
        marker.x_norm < 0 || marker.x_norm > 1 || marker.y_norm < 0 || marker.y_norm > 1) continue;
    if (valid.has(marker.target_id)) duplicates.add(marker.target_id);
    valid.set(marker.target_id, marker);
  }
  for (const id of duplicates) valid.delete(id);
  // 同じスロットへ複数マーカーが見えたら小さいIDを優先。1フレームに1モデルのみ。
  const slotsSeen=new Set();
  for(const id of [...valid.keys()].sort((a,b)=>a-b)){
    const slot=arucoMarkerBindings[id].slot;
    if(slotsSeen.has(slot))valid.delete(id);else slotsSeen.add(slot);
  }
  arucoDetectedCount = valid.size;
  // 毎フレーム最新値だけを保持する。消失・重複時に古いデータを再適用しない。
  pendingArucoMarkers.clear();
  if (arucoEnabled.checked) {
    const now = performance.now();
    for (const [id, marker] of valid) {
      arucoLastSeen.set(arucoConfig.markerSetters[id], now);
      pendingArucoMarkers.set(id, convertArucoMarker(marker));
    }
    // 計算は描画時に最新値だけ反映する。受信イベント内でRaycasterを実行しない。
  }
  updateArucoVisibility();
  updateArucoStatus();
}

function applyPendingArucoMarkers() {
  if (!arucoEnabled.checked) return;
  for (const [id, state] of pendingArucoMarkers) {
    const binding=arucoMarkerBindings[id],choice=slotChoices[binding.slot];
    const editor=partEditors.get(binding.slot);
    if(binding.model&&choice.type!==binding.model){
      if(!editor)continue;
      if(!choice.loadingMarkerModel){
        choice.loadingMarkerModel=true;
        editor.selectModel(binding.model,{manual:false,stillCurrent:()=>pendingArucoMarkers.has(id)&&performance.now()-(arucoLastSeen.get(arucoConfig.markerSetters[id])??-Infinity)<arucoConfig.lostGraceMs}).finally(()=>{choice.loadingMarkerModel=false;renderPartEditor();});
      }
      continue;
    }
    const setter = window[arucoConfig.markerSetters[id]];
    // GLBが読み込み中なら、配置関数が用意されるまで最新値を待たせる。
    if (typeof setter !== 'function') continue;
    const setterName = arucoConfig.markerSetters[id];
    const lastSeen = arucoLastSeen.get(setterName);
    if (!arucoConnected || lastSeen === undefined ||
        performance.now() - lastSeen >= arucoConfig.lostGraceMs) {
      pendingArucoMarkers.delete(id);
      continue;
    }
    // 初回の再表示は、新しい計測姿勢を適用してから行う。
    if (setter(state.x, state.y, state.rotation)) arucoPlacedParts.add(setterName);
    pendingArucoMarkers.delete(id);
  }
}

function connectAruco() {
  if (arucoStopped) return;
  try {
    arucoSocket = new WebSocket(arucoConfig.url);
  } catch {
    updateArucoStatus();
    arucoReconnectTimer = setTimeout(connectAruco, arucoConfig.reconnectMs);
    return;
  }
  const socket = arucoSocket;
  socket.addEventListener('open', () => {
    if (socket !== arucoSocket || arucoStopped) return;
    arucoConnected = true;
    arucoFrameReceived = false;
    clearArucoTracking();
    updateArucoStatus();
  });
  socket.addEventListener('message', (event) => {
    if (socket === arucoSocket && !arucoStopped) receiveArucoMessage(event.data);
  });
  socket.addEventListener('error', () => socket.close());
  socket.addEventListener('close', () => {
    if (socket !== arucoSocket) return;
    arucoConnected = false;
    clearArucoTracking();
    updateArucoStatus();
    if (!arucoStopped) arucoReconnectTimer = setTimeout(connectAruco, arucoConfig.reconnectMs);
  });
}

arucoEnabled.addEventListener('change', () => {
  clearArucoTracking();
  updateArucoStatus();
});
window.addEventListener('pagehide', () => {
  arucoStopped = true;
  arucoConnected = false;
  clearArucoTracking();
  clearTimeout(arucoReconnectTimer);
  if (arucoSocket) arucoSocket.close();
});
window.addEventListener('pageshow', () => {
  if (arucoStopped) { arucoStopped = false; connectAruco(); }
});
updateArucoStatus();
connectAruco();

// ========================================
// モデルの姿勢更新
// ========================================

let characterSurfaceRevision = 0;
const meshSurfaceSnapshots = new WeakMap();

function refreshCharacterMatrices() {
  character.updateMatrixWorld(true);
  let changed = false;
  for (const mesh of characterMeshes) {
    if (mesh.isSkinnedMesh) mesh.skeleton.update();
    const matrices = mesh.isSkinnedMesh ? mesh.skeleton.boneMatrices : null;
    const morphs = mesh.morphTargetInfluences || [];
    let snapshot = meshSurfaceSnapshots.get(mesh);
    const geometry = mesh.geometry;
    const positionVersion = geometry.attributes.position.version;
    const indexVersion = geometry.index?.version;
    const bindMatrices = mesh.isSkinnedMesh
      ? [...mesh.bindMatrix.elements, ...mesh.bindMatrixInverse.elements] : [];
    if (!snapshot || snapshot.bones.length !== (matrices?.length || 0) ||
        snapshot.morphs.length !== morphs.length) {
      snapshot = {
        world: new Float64Array(16),
        bones: new Float32Array(matrices?.length || 0),
        morphs: new Float64Array(morphs.length),
        bind: new Float64Array(bindMatrices.length)
      };
      meshSurfaceSnapshots.set(mesh, snapshot);
      changed = true;
    }
    if (snapshot.geometry !== geometry || snapshot.positionVersion !== positionVersion ||
        snapshot.indexVersion !== indexVersion) changed = true;
    snapshot.geometry = geometry;
    snapshot.positionVersion = positionVersion;
    snapshot.indexVersion = indexVersion;
    const sources = [mesh.matrixWorld.elements, matrices || [], morphs, bindMatrices];
    const targets = [snapshot.world, snapshot.bones, snapshot.morphs, snapshot.bind];
    for (let n = 0; n < sources.length; n++) {
      for (let i = 0; i < sources[n].length; i++) {
        if (targets[n][i] !== sources[n][i]) changed = true;
        targets[n][i] = sources[n][i];
      }
    }
  }
  if (changed) characterSurfaceRevision++;
}

// レイの交点配列と一時ベクトルは使い回し、毎回の小さな割り当てを減らす。
const surfaceRayHits = [];
const surfaceRayOrigin = new THREE.Vector3();
const surfaceRaySize = new THREE.Vector3();
const sampleDirection = new THREE.Vector3();
const sampleOffset = new THREE.Vector3();
const sampleOrigin = new THREE.Vector3();
const sampleRiseVector = new THREE.Vector3();

function intersectCharacterSurface() {
  surfaceRayHits.length = 0;
  return raycaster.intersectObjects(characterMeshes, false, surfaceRayHits);
}

// ========================================
// 頭の実際の表面を探す
// ========================================

function findHeadSurface(worldX, worldY) {

  if (
    worldY < headMinY ||
    worldY > characterBox.max.y
  ) {
    return null;
  }

  raycaster.set(

    surfaceRayOrigin.set(worldX, worldY, characterBox.max.z + maxSize),

    rayDirection

  );

  raycaster.near = 0;

  raycaster.far =
    characterBox.getSize(surfaceRaySize).z
    + maxSize * 2;

  const hits = intersectCharacterSurface();

  return hits.find(
    (hit) =>
      hit.face &&
      hit.point.y >= headMinY
  ) || null;

}


// ========================================
// メッシュ表面の法線を取得
// ========================================

function getSurfaceNormal(hit) {

  const mesh = hit.object;

  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const c = new THREE.Vector3();

  mesh.getVertexPosition(
    hit.face.a,
    a
  ).applyMatrix4(mesh.matrixWorld);

  mesh.getVertexPosition(
    hit.face.b,
    b
  ).applyMatrix4(mesh.matrixWorld);

  mesh.getVertexPosition(
    hit.face.c,
    c
  ).applyMatrix4(mesh.matrixWorld);

  const ab = new THREE.Vector3()
    .subVectors(b, a);

  const ac = new THREE.Vector3()
    .subVectors(c, a);

  const normal = new THREE.Vector3()
    .crossVectors(ab, ac);

  if (normal.lengthSq() < 1e-20) {
    return null;
  }

  normal.normalize();

  if (normal.dot(rayDirection) > 0) {
    normal.negate();
  }

  return normal;

}


// ========================================
// パーツ周辺の表面を確認
// ========================================

function calculateSurfaceRise(
  hit,
  normal,
  orientation,
  halfWidth,
  halfHeight
) {

  let surfaceRise = 0;

  sampleDirection.copy(normal).negate();

  for (let ix = -1; ix <= 1; ix++) {

    for (let iy = -1; iy <= 1; iy++) {

      sampleOffset.set(ix * halfWidth, iy * halfHeight, 0)
        .applyQuaternion(orientation);
      sampleOrigin.copy(hit.point).add(sampleOffset)
        .addScaledVector(normal, maxSize);

      raycaster.set(
        sampleOrigin,
        sampleDirection
      );

      raycaster.near = 0;
      raycaster.far = maxSize * 2;

      const sampleHit =
        intersectCharacterSurface().find(
          (candidate) =>
            candidate.point.y >= headMinY
        );

      if (sampleHit) {

        const rise =
          sampleRiseVector.subVectors(sampleHit.point, hit.point).dot(normal);

        surfaceRise = Math.max(
          surfaceRise,
          rise
        );

      }

    }

  }

  return surfaceRise;

}


// ========================================
// ★ 顔パーツ共通の読み込み処理
// ========================================

function loadFacePart(
  partName,
  xSliderId,
  ySliderId,
  depthSliderId,
  rotationSliderId
) {

  const initialType=slotDefinitions[partName].type;
  const settings = partSettings[initialType];

  loadPartTemplate(initialType).then((template) => {

      let part = cloneSkeleton(template);
      let activeModelType = initialType;


      // ========================================
      // パーツのサイズを調整
      // ========================================

      const originalBox =
        new THREE.Box3().setFromObject(part);

      const originalSize =
        originalBox.getSize(new THREE.Vector3());

      const maxPartSize = Math.max(
        originalSize.x,
        originalSize.y,
        originalSize.z
      );

      if (maxPartSize <= 0) {

        message.textContent =
          `${partName}の大きさを取得できませんでした`;

        return;

      }

      const targetSize =
        headRadius * settings.sizeMultiplier;

      const scale =
        targetSize / maxPartSize;

      part.scale.multiplyScalar(scale);


      // ========================================
      // パーツの中心を原点にする
      // ========================================

      const scaledBox =
        new THREE.Box3().setFromObject(part);

      const partCenter =
        scaledBox.getCenter(new THREE.Vector3());

      const scaledSize =
        scaledBox.getSize(new THREE.Vector3());

      part.position.sub(partCenter);


      // ========================================
      // 配置用グループ
      // ========================================

      const partGroup = new THREE.Group();

      partGroup.add(part);

      scene.add(partGroup);

      partGroup.visible = false;


      // ========================================
      // パーツの厚み
      // ========================================

      partGroup.updateMatrixWorld(true);

      const centeredBox =
        new THREE.Box3().setFromObject(partGroup);

      let baseBounds=centeredBox.clone();
      let rearDepth = Math.max(
        0,
        -centeredBox.min.z
      );

      let halfWidth =
        scaledSize.x * 0.5;

      let halfHeight =
        scaledSize.y * 0.5;


      // ========================================
      // スライダー取得
      // ========================================

      const xSlider =
        document.getElementById(xSliderId);

      const ySlider =
        document.getElementById(ySliderId);

      const depthSlider = depthSliderId
        ? document.getElementById(depthSliderId)
        : null;


      const rotationSlider = document.getElementById(rotationSliderId);
      const state = { x: Number(xSlider.value), y: Number(ySlider.value), rotation: 0, depth: -0.1, scale:1, tilt:0 };

      const sizeControl=adjustmentControls[partName].scale,tiltControl=adjustmentControls[partName].tilt;
      function syncControls() {
        const settings=partSettings[activeModelType];
        sizeControl.row.hidden=settings.hideAdjustmentControls===true;
        tiltControl.row.hidden=settings.hideAdjustmentControls===true;
        if(depthSlider)depthSlider.closest('.controlRow').hidden=settings.hideAdjustmentControls===true;
        sizeControl.input.disabled=settings.scaleLocked===true;tiltControl.input.disabled=settings.tiltLocked===true;
        sizeControl.input.title=sizeControl.input.disabled?'このモデルの大きさは固定だよ':'基準サイズに対する倍率';
        tiltControl.input.title=tiltControl.input.disabled?'このモデルの前後の傾きは固定だよ':'＋：上側が手前／−：下側が手前';
        sizeControl.input.value=String(state.scale);sizeControl.value.textContent=state.scale.toFixed(2)+'倍';
        tiltControl.input.value=String(state.tilt);tiltControl.value.textContent=state.tilt+'°';
        xSlider.value = String(state.x);
        ySlider.value = String(state.y);
        rotationSlider.value = String(state.rotation);
        if (depthSlider) {
          depthSlider.disabled = partSettings[activeModelType].depthLocked === true;
          depthSlider.title = depthSlider.disabled ? 'このモデルの沈み具合は固定だよ' : '浮き具合を調整';
          depthSlider.value = String(state.depth);
          document.getElementById(depthSliderId + 'Value').textContent = state.depth.toFixed(2);
        }
        document.getElementById(xSliderId + 'Value').textContent = state.x.toFixed(2);
        document.getElementById(ySliderId + 'Value').textContent = state.y.toFixed(2);
        document.getElementById(rotationSliderId + 'Value').textContent =
          String(Number(state.rotation.toFixed(2)));
      }

      // パーツごとに直近1つのX・Yだけを保持し、履歴でメモリが増えないようにする。
      const surfaceCache = {
        x: NaN, y: NaN, revision: -1, valid: false,
        point: new THREE.Vector3(), normal: new THREE.Vector3(),
        orientation: new THREE.Quaternion(), minimumOffset: 0
      };
      const localRotation = new THREE.Quaternion();
      let lastActualDepth,geometryScale=1,geometryTilt=0;

      // ========================================
      // ★ 位置・回転・埋め込み量を更新
      // ========================================

      function updatePartPosition(x, y, rotationDeg = state.rotation, depth = state.depth, sizeScale = state.scale, tiltDeg = state.tilt) {

        if (
          ![x, y, rotationDeg, depth, sizeScale, tiltDeg].every(Number.isFinite)
        ) {
          return false;
        }

        const adjustment=readPartAdjustment({scale:sizeScale,tilt:tiltDeg},partSettings[activeModelType]);
        const adjustmentChanged=adjustment.scale!==geometryScale||adjustment.tilt!==geometryTilt;
        if(adjustmentChanged){
          const bounds=adjustedPartBounds(baseBounds,adjustment.scale,adjustment.tilt),size=bounds.getSize(new THREE.Vector3());
          rearDepth=Math.max(0,-bounds.min.z);halfWidth=size.x/2;halfHeight=size.y/2;geometryScale=adjustment.scale;geometryTilt=adjustment.tilt;surfaceCache.revision=-1;
        }
        refreshCharacterMatrices();

        const surfaceChanged = surfaceCache.x !== x || surfaceCache.y !== y ||
          surfaceCache.revision !== characterSurfaceRevision;
        if (surfaceChanged) {
          surfaceCache.x = x;
          surfaceCache.y = y;
          surfaceCache.revision = characterSurfaceRevision;
          surfaceCache.valid = false;
          const hit = findHeadSurface(
            headCenter.x + headRadius * x,
            headCenter.y + headRadius * y
          );
          if (!hit) {
            message.textContent = `${partName}：指定位置に頭の表面がありません`;
            return false;
          }
          const normal = getSurfaceNormal(hit);
          if (!normal) return false;
          surfaceCache.point.copy(hit.point);
          surfaceCache.normal.copy(normal);
          surfaceCache.orientation.setFromUnitVectors(forward, normal);
          const surfaceRise = calculateSurfaceRise(
            hit, normal, surfaceCache.orientation, halfWidth, halfHeight
          );
          surfaceCache.minimumOffset = rearDepth + surfaceRise + maxSize * 0.001;
          surfaceCache.valid = true;
        }
        // 同じ無効位置の再受信も、最後の有効姿勢を残してレイ計算を省く。
        if (!surfaceCache.valid) return false;
        const normal = surfaceCache.normal;
        const orientation = surfaceCache.orientation;
        const minimumOffset = surfaceCache.minimumOffset;

        // --------------------------------
        // パーツごとの埋め込み量（初期値 -0.1）
        // --------------------------------

        const activeSettings = partSettings[activeModelType];
        const actualDepth = activeSettings.depthLocked ? activeSettings.fixedDepth : depth;

        const rotation = rotationDeg >= -180 && rotationDeg <= 180
          ? rotationDeg
          : ((rotationDeg % 360 + 540) % 360) - 180;
        // 同一の検出値なら、姿勢とUIの再書き込みも不要。
        if (!surfaceChanged && state.x === x && state.y === y &&
            state.rotation === rotation && lastActualDepth === actualDepth) return true;
        const offset = minimumOffset + headRadius * actualDepth;
        lastActualDepth = actualDepth;


        // --------------------------------
        // 位置と向きを反映
        // --------------------------------

        partGroup.position
          .copy(surfaceCache.point)
          .addScaledVector(
            normal,
            offset
          );

        // 曲面補正は0°の向きで計算し、角度だけで取り付け位置が動くのを防ぐ。
        // qSurface * qLocalZ: ローカル+Zは合成後も頭の表面法線に一致する。
        // 正の角度は正面から見て反時計回り。ArUcoの度数をそのまま使える。
        localRotation.setFromAxisAngle(forward, THREE.MathUtils.degToRad(rotation));
        partGroup.quaternion.copy(orientation).multiply(localRotation);
        applyPartAdjustment(partGroup,adjustment.scale,adjustment.tilt);

        Object.assign(state, { x, y, rotation, depth: actualDepth, ...adjustment });
        facePartStates[partName] = state;
        syncControls();

        updateArucoVisibility();

        return true;

      }


      // ========================================
      // スライダーの値を反映
      // ========================================

      function updateFromSliders(event) {

        // 外部入力後も、触っていない座標・角度はそのまま保持する。
        const x = !event || event.target === xSlider ? Number(xSlider.value) : state.x;
        const y = !event || event.target === ySlider ? Number(ySlider.value) : state.y;
        const rotation = !event || event.target === rotationSlider
          ? Number(rotationSlider.value) : state.rotation;

        const depth =
          Number(depthSlider?.value ?? state.depth);


        // --------------------------------
        // 数値表示
        // --------------------------------

        document.getElementById(
          xSliderId + 'Value'
        ).textContent = x.toFixed(2);

        document.getElementById(
          ySliderId + 'Value'
        ).textContent = y.toFixed(2);

        if (depthSliderId) {

          document.getElementById(
            depthSliderId + 'Value'
          ).textContent = depth.toFixed(2);

        }


        const sizeScale=!event||event.target===sizeControl.input?Number(sizeControl.input.value):state.scale;
        const tilt=!event||event.target===tiltControl.input?Number(tiltControl.input.value):state.tilt;
        const placed = updatePartPosition(x, y, rotation, depth,sizeScale,tilt);
        if (!placed && facePartStates[partName]) syncControls();
        return placed;

      }


      // ========================================
      // スライダーイベント
      // ========================================

      xSlider.addEventListener(
        'input',
        updateFromSliders
      );

      ySlider.addEventListener(
        'input',
        updateFromSliders
      );

      rotationSlider.addEventListener('input', updateFromSliders);
      sizeControl.input.addEventListener('input',updateFromSliders);tiltControl.input.addEventListener('input',updateFromSliders);

      if (depthSlider) {

        depthSlider.addEventListener(
          'input',
          updateFromSliders
        );

      }


      // ========================================
      // 外部入力（将来のArUco用）
      // ========================================

      const setterName=slotDefinitions[partName].setter;
      window[setterName]=(x,y,rotationDeg=state.rotation)=>updatePartPosition(x,y,rotationDeg);
      arucoPartGroups.set(setterName,partGroup);
      if(partName==='eye_01')window.setEyeCoordinates=window.setEye01Coordinates;

      // ========================================
      // 初期配置
      // ========================================

      partEditors.set(partName, {
        async selectModel(type,{manual=true,stillCurrent=()=>true}={}) {
          const choice = slotChoices[partName];
          const revision = choice.revision = (choice.revision ?? 0) + 1;
          partStatus.textContent = `${type}を読み込み中…`;
          try {
            const template = await loadPartTemplate(type);
            if (revision !== choice.revision || !stillCurrent() || (!manual && (!arucoEnabled.checked || !arucoConnected))) return;
            const replacement = cloneSkeleton(template);
            const bounds = new THREE.Box3().setFromObject(replacement);
            const size = bounds.getSize(new THREE.Vector3());
            const max = Math.max(size.x, size.y, size.z);
            if (!(max > 0)) throw new Error('モデルの大きさを取得できない');
            replacement.scale.multiplyScalar(headRadius * partSettings[type].sizeMultiplier / max);
            const scaled = new THREE.Box3().setFromObject(replacement);
            const dimensions = scaled.getSize(new THREE.Vector3());
            replacement.position.sub(scaled.getCenter(new THREE.Vector3()));
            replacement.updateMatrixWorld(true);
            const centered = new THREE.Box3().setFromObject(replacement);
            const old = { part, rearDepth, halfWidth, halfHeight, activeModelType, baseBounds };
            const changedModel=activeModelType!==type;
            const nextSettings=partSettings[type];
            const nextAdjustment=changedModel?readPartAdjustment({},nextSettings):{scale:state.scale,tilt:state.tilt};
            const nextDepth=changedModel?nextSettings.fixedDepth:state.depth;
            activeModelType = type;
            baseBounds=centered.clone();
            const adjusted=adjustedPartBounds(baseBounds,state.scale,state.tilt),adjustedSize=adjusted.getSize(new THREE.Vector3());
            rearDepth = Math.max(0, -adjusted.min.z);
            halfWidth = adjustedSize.x / 2; halfHeight = adjustedSize.y / 2;
            surfaceCache.revision = -1;
            if (!updatePartPosition(state.x, state.y, state.rotation, nextDepth,nextAdjustment.scale,nextAdjustment.tilt)) {
              ({part, rearDepth, halfWidth, halfHeight, activeModelType, baseBounds} = old);
              surfaceCache.revision = -1;
              updatePartPosition(state.x, state.y, state.rotation, state.depth);
              throw new Error('この位置には配置できない');
            }
            partGroup.remove(part); part = replacement; partGroup.add(part);
            choice.type = type; choice.enabled = true;
            syncControls();
            // 手動選択したモデルは、マーカーなしでもその場で確認する。
            if (manual && arucoEnabled.checked) { arucoEnabled.checked = false; clearArucoTracking(); updateArucoStatus(); }
            updateArucoVisibility();
            partStatus.textContent = `${type}を表示中（${manual?'手動プレビュー':'ArUco'}）`;
            return true;
          } catch (error) {
            if (revision === choice.revision) partStatus.textContent = `${type}を読み込めなかったよ。${error.message??'ファイルと配置を確認してね。'}`;
            console.error(error);
          }
        },
        reset() {
          const defaults=slotDefinitions[partName].defaults;
          updatePartPosition(defaults.x,defaults.y,defaults.rotation,partSettings[activeModelType].fixedDepth,1,0);
        }
      });

      const defaults=slotDefinitions[partName].defaults;
      xSlider.value=String(defaults.x);ySlider.value=String(defaults.y);
      if(depthSlider)depthSlider.value=String(settings.fixedDepth);
      const placed = updateFromSliders();

      if (placed) {
        message.textContent = `${partName}を読み込みました！`;
      }

    }).catch((error) => {
      console.error(error);
      partStatus.textContent = `${partName}の読み込みに失敗したよ。${error.message??'ファイルを確認してね。'}`;
    });

}

// ウィンドウサイズ変更
// ========================================

window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});


// ========================================
// 描画
// ========================================
