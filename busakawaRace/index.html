<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ぶさかわレース</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #eeeeee;
      font-family: sans-serif;
    }

    #message {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    #partControls {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 220px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      z-index: 10;
    }

    #partControls h3 {
      margin-top: 0;
    }

    #partControls input {
      width: 100%;
    }

    .controlRow {
      margin-bottom: 15px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section + .section {
      padding-top: 15px;
      border-top: 1px solid #dddddd;
    }

    label {
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #777777;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<div id="message">読み込み中...</div>

<!-- ========================================
     パーツ調整UI
======================================== -->

<div id="partControls">

  <div class="section">
    <h3>ArUco連携</h3>
    <label><input type="checkbox" id="arucoEnabled" checked
      style="width: auto;"> マーカーの動きを反映する</label>
    <p id="arucoStatus" class="note" role="status">接続準備中</p>
    <p class="note">OFFにすると手動で調整できるよ。</p>
  </div>

  <!-- 目 -->
  <div class="section">

    <h3>目の位置調整</h3>

    <div class="controlRow">
      <label>
        左右（X）：
        <span id="eyeXValue">-0.40</span>
      </label>

      <input
        type="range"
        id="eyeX"
        min="-0.75"
        max="0.75"
        step="0.01"
        value="-0.4"
      >
    </div>

    <div class="controlRow">
      <label>
        上下（Y）：
        <span id="eyeYValue">0.10</span>
      </label>

      <input
        type="range"
        id="eyeY"
        min="-0.65"
        max="0.65"
        step="0.01"
        value="0.1"
      >
    </div>

    <div class="controlRow">
      <label for="eyeRotation">回転：<span id="eyeRotationValue">0</span>°</label>
      <input type="range" id="eyeRotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>
        浮き具合（固定）：
        <span id="eyeDepthValue">-0.10</span>
      </label>

      <input
        type="range"
        min="-0.15"
        max="0.15"
        step="0.01"
        value="-0.10"
        disabled
      >
    </div>

  </div>

  <!-- 2つ目の目：計測済み座標の仮データを初期値にする -->
  <div class="section">

    <h3>2つ目の目（eye_02）</h3>

    <div class="controlRow">
      <label>左右（X）：<span id="eye02XValue">0.40</span></label>
      <input type="range" id="eye02X"
        min="-0.75" max="0.75" step="0.01" value="0.4">
    </div>

    <div class="controlRow">
      <label>上下（Y）：<span id="eye02YValue">0.10</span></label>
      <input type="range" id="eye02Y"
        min="-0.65" max="0.65" step="0.01" value="0.1">
    </div>

    <div class="controlRow">
      <label for="eye02Rotation">回転：<span id="eye02RotationValue">0</span>°</label>
      <input type="range" id="eye02Rotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>浮き具合（固定）：<span id="eye02DepthValue">-0.10</span></label>
      <input type="range" id="eye02Depth"
        min="-0.15" max="0.15" step="0.01" value="-0.10" disabled>
    </div>

    <p class="note">初期位置は計測済み座標の仮データ。X・Yで調整できるよ。</p>

  </div>

  <!-- 口 -->
  <div class="section">

    <h3>口の位置調整</h3>

    <div class="controlRow">
      <label>
        左右（X）：
        <span id="mouthXValue">0.00</span>
      </label>

      <input
        type="range"
        id="mouthX"
        min="-0.75"
        max="0.75"
        step="0.01"
        value="0"
      >
    </div>

    <div class="controlRow">
      <label>
        上下（Y）：
        <span id="mouthYValue">-0.35</span>
      </label>

      <input
        type="range"
        id="mouthY"
        min="-0.65"
        max="0.65"
        step="0.01"
        value="-0.35"
      >
    </div>

    <div class="controlRow">
      <label for="mouthRotation">回転：<span id="mouthRotationValue">0</span>°</label>
      <input type="range" id="mouthRotation"
        min="-180" max="180" step="1" value="0">
    </div>

    <div class="controlRow">
      <label>
        浮き具合：
        <span id="mouthDepthValue">0.00</span>
      </label>

      <input
        type="range"
        id="mouthDepth"
        min="-0.20"
        max="0.20"
        step="0.01"
        value="-0.10"
        disabled
       >
    </div>

    <p class="note">
      マイナス：頭に埋め込む<br>
      プラス：頭から浮かせる
    </p>

  </div>

</div>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


// ========================================
// 基本設定
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xeeeeee);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// ライト
// ========================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x888888,
    2
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(3, 5, 5);

scene.add(light);


// ========================================
// カメラ操作
// ========================================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;


// ========================================
// 共通変数
// ========================================

const loader = new GLTFLoader();

const message = document.getElementById('message');

let character;

let headRadius;
let headCenter;
let characterBox;
let maxSize;

let characterMeshes = [];

const raycaster = new THREE.Raycaster();

const rayDirection = new THREE.Vector3(0, 0, -1);

const forward = new THREE.Vector3(0, 0, 1);

let headMinY;


// ========================================
// パーツごとの設定
// ========================================

// 顔パーツごとのモデル・サイズ・固定沈み量。
// 計測済みを想定した仮データ。実際のArUco計測値ではない。
// X・Yはスライダーと同じ尺度へ変換済みの座標を使う。
const measuredEye02Coordinates = { x: 0.4, y: 0.1 };

const partSettings = {

  eye_01: {
    path: './assets/eyes/eye_01.glb',
    sizeMultiplier: 0.48,
    fixedDepth: -0.1
  },

  eye_02: {
    path: './assets/eyes/eye_02.glb',
    sizeMultiplier: 0.48,
    fixedDepth: -0.1,
    initialCoordinates: measuredEye02Coordinates
  },

  mouth_01: {
  path: './assets/mouths/mouth_01.glb',
  sizeMultiplier: 0.55,
  fixedDepth: -0.1

}

};


// 有効に配置できた状態だけを保持する。取得結果はコピーなので外部変更されない。
const facePartStates = {};
window.getFacePartStates = () => Object.fromEntries(
  Object.entries(facePartStates).map(([name, state]) => [name, { ...state }])
);

// ========================================
// ArUco WebSocket設定（キャリブレーションはここで変更）
// ========================================
const arucoConfig = {
  url: 'ws://127.0.0.1:8766',
  // マーカーID → 既存の配置関数名
  markerSetters: {
    0: 'setEye01Coordinates',
    1: 'setEye02Coordinates',
    2: 'setMouthCoordinates'
  },
  // check.pyの正規化座標は下が0・上が1。中心0.5を顔の中心に合わせる。
  centerX: 0.5,
  centerY: 0.5,
  scaleX: 1,
  scaleY: 1,
  offsetX: 0,
  offsetY: 0,
  flipX: false,
  flipY: false,
  rotationOffsetDeg: 0,
  reconnectMs: 2000
};

const arucoEnabled = document.getElementById('arucoEnabled');
const arucoStatus = document.getElementById('arucoStatus');
const pendingArucoMarkers = new Map();
let arucoSocket;
let arucoReconnectTimer;
let arucoStopped = false;
let arucoConnected = false;
let arucoFrameReceived = false;
let arucoDetectedCount = 0;

function updateArucoStatus() {
  if (!arucoEnabled.checked) {
    arucoStatus.textContent = '自動反映OFF：スライダーで調整できるよ';
  } else if (!arucoConnected) {
    arucoStatus.textContent = '未接続：Pythonの起動を待っているよ（手動操作OK）';
  } else if (!arucoFrameReceived) {
    arucoStatus.textContent = '接続済み：検出データを待っているよ';
  } else {
    arucoStatus.textContent = `受信中：対象マーカー ${arucoDetectedCount}個（未検出のパーツは最後の位置を維持）`;
  }
}

function convertArucoMarker(marker) {
  let x = (marker.x_norm - arucoConfig.centerX) * 2 * 0.75 * arucoConfig.scaleX;
  let y = (marker.y_norm - arucoConfig.centerY) * 2 * 0.65 * arucoConfig.scaleY;
  let rotation = marker.rotation_ccw_deg;
  // 反転時は角度も同じ鏡映に合わせる。
  if (arucoConfig.flipX) { x = -x; rotation = 180 - rotation; }
  if (arucoConfig.flipY) { y = -y; rotation = -rotation; }
  return {
    x: THREE.MathUtils.clamp(x + arucoConfig.offsetX, -0.75, 0.75),
    y: THREE.MathUtils.clamp(y + arucoConfig.offsetY, -0.65, 0.65),
    rotation: rotation + arucoConfig.rotationOffsetDeg
  };
}

function receiveArucoMessage(raw) {
  let data;
  try { data = JSON.parse(raw); } catch { return; }
  if (!data || data.type !== 'aruco_frame' || !Array.isArray(data.markers)) return;
  arucoFrameReceived = true;
  const valid = new Map();
  const duplicates = new Set();
  for (const marker of data.markers) {
    if (!marker || !Number.isInteger(marker.target_id) || marker.detected !== true ||
        !Object.hasOwn(arucoConfig.markerSetters, marker.target_id) ||
        ![marker.x_norm, marker.y_norm, marker.rotation_ccw_deg].every(Number.isFinite) ||
        marker.x_norm < 0 || marker.x_norm > 1 || marker.y_norm < 0 || marker.y_norm > 1) continue;
    if (valid.has(marker.target_id)) duplicates.add(marker.target_id);
    valid.set(marker.target_id, marker);
  }
  for (const id of duplicates) valid.delete(id);
  arucoDetectedCount = valid.size;
  // 毎フレーム最新値だけを保持する。消失・重複時に古いデータを再適用しない。
  pendingArucoMarkers.clear();
  if (arucoEnabled.checked) {
    for (const [id, marker] of valid) pendingArucoMarkers.set(id, convertArucoMarker(marker));
    applyPendingArucoMarkers();
  }
  updateArucoStatus();
}

function applyPendingArucoMarkers() {
  if (!arucoEnabled.checked) return;
  for (const [id, state] of pendingArucoMarkers) {
    const setter = window[arucoConfig.markerSetters[id]];
    // GLBが読み込み中なら、配置関数が用意されるまで最新値を待たせる。
    if (typeof setter !== 'function') continue;
    setter(state.x, state.y, state.rotation);
    pendingArucoMarkers.delete(id);
  }
}

function connectAruco() {
  if (arucoStopped) return;
  try {
    arucoSocket = new WebSocket(arucoConfig.url);
  } catch {
    updateArucoStatus();
    arucoReconnectTimer = setTimeout(connectAruco, arucoConfig.reconnectMs);
    return;
  }
  const socket = arucoSocket;
  socket.addEventListener('open', () => {
    if (socket !== arucoSocket || arucoStopped) return;
    arucoConnected = true;
    arucoFrameReceived = false;
    updateArucoStatus();
  });
  socket.addEventListener('message', (event) => {
    if (socket === arucoSocket && !arucoStopped) receiveArucoMessage(event.data);
  });
  socket.addEventListener('error', () => socket.close());
  socket.addEventListener('close', () => {
    if (socket !== arucoSocket) return;
    arucoConnected = false;
    pendingArucoMarkers.clear();
    updateArucoStatus();
    if (!arucoStopped) arucoReconnectTimer = setTimeout(connectAruco, arucoConfig.reconnectMs);
  });
}

arucoEnabled.addEventListener('change', () => {
  pendingArucoMarkers.clear();
  updateArucoStatus();
});
window.addEventListener('pagehide', () => {
  arucoStopped = true;
  clearTimeout(arucoReconnectTimer);
  if (arucoSocket) arucoSocket.close();
});
window.addEventListener('pageshow', () => {
  if (arucoStopped) { arucoStopped = false; connectAruco(); }
});
updateArucoStatus();
connectAruco();

// ========================================
// 頭足人を読み込む
// ========================================

loader.load(

  './assets/characters/tousokujin.glb',

  (gltf) => {

    character = gltf.scene;

    scene.add(character);

    characterBox =
      new THREE.Box3().setFromObject(character);

    const center =
      characterBox.getCenter(new THREE.Vector3());

    const size =
      characterBox.getSize(new THREE.Vector3());

    maxSize = Math.max(
      size.x,
      size.y,
      size.z
    );


    // ========================================
    // カメラ位置
    // ========================================

    camera.position.set(
      center.x,
      center.y + maxSize * 0.3,
      center.z + maxSize * 2.5
    );

    controls.target.copy(center);

    controls.update();


    // ========================================
    // 頭の位置
    // ========================================

    headRadius = Math.min(
      size.x * 0.48,
      size.y * 0.34
    );

    headCenter = new THREE.Vector3(
      center.x,
      characterBox.max.y - headRadius,
      center.z
    );

    headMinY = headCenter.y - headRadius;


    // ========================================
    // メッシュを収集
    // ========================================

    character.traverse((object) => {

      if (object.isMesh) {
        characterMeshes.push(object);
      }

    });


    // ========================================
    // 顔パーツを読み込む
    // ========================================

    loadFacePart(
      'eye_01',
      'eyeX',
      'eyeY',
      null,
      'eyeRotation'
    );

    loadFacePart(
      'eye_02',
      'eye02X',
      'eye02Y',
      'eye02Depth',
      'eye02Rotation'
    );

    loadFacePart(
      'mouth_01',
      'mouthX',
      'mouthY',
      'mouthDepth',
      'mouthRotation'
    );

  },

  undefined,

  (error) => {

    console.error(error);

    message.textContent =
      '頭足人の読み込みに失敗しました';

  }

);


// ========================================
// モデルの姿勢更新
// ========================================

function refreshCharacterMatrices() {

  character.updateMatrixWorld(true);

  characterMeshes.forEach((mesh) => {

    if (mesh.isSkinnedMesh) {
      mesh.skeleton.update();
    }

  });

}


// ========================================
// 頭の実際の表面を探す
// ========================================

function findHeadSurface(worldX, worldY) {

  if (
    worldY < headMinY ||
    worldY > characterBox.max.y
  ) {
    return null;
  }

  raycaster.set(

    new THREE.Vector3(
      worldX,
      worldY,
      characterBox.max.z + maxSize
    ),

    rayDirection

  );

  raycaster.near = 0;

  raycaster.far =
    characterBox.getSize(new THREE.Vector3()).z
    + maxSize * 2;

  const hits = raycaster.intersectObjects(
    characterMeshes,
    false
  );

  return hits.find(
    (hit) =>
      hit.face &&
      hit.point.y >= headMinY
  ) || null;

}


// ========================================
// メッシュ表面の法線を取得
// ========================================

function getSurfaceNormal(hit) {

  const mesh = hit.object;

  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const c = new THREE.Vector3();

  mesh.getVertexPosition(
    hit.face.a,
    a
  ).applyMatrix4(mesh.matrixWorld);

  mesh.getVertexPosition(
    hit.face.b,
    b
  ).applyMatrix4(mesh.matrixWorld);

  mesh.getVertexPosition(
    hit.face.c,
    c
  ).applyMatrix4(mesh.matrixWorld);

  const ab = new THREE.Vector3()
    .subVectors(b, a);

  const ac = new THREE.Vector3()
    .subVectors(c, a);

  const normal = new THREE.Vector3()
    .crossVectors(ab, ac);

  if (normal.lengthSq() < 1e-20) {
    return null;
  }

  normal.normalize();

  if (normal.dot(rayDirection) > 0) {
    normal.negate();
  }

  return normal;

}


// ========================================
// パーツ周辺の表面を確認
// ========================================

function calculateSurfaceRise(
  hit,
  normal,
  orientation,
  halfWidth,
  halfHeight
) {

  let surfaceRise = 0;

  const sampleDirection =
    normal.clone().negate();

  for (let ix = -1; ix <= 1; ix++) {

    for (let iy = -1; iy <= 1; iy++) {

      const sampleOffset =
        new THREE.Vector3(
          ix * halfWidth,
          iy * halfHeight,
          0
        ).applyQuaternion(orientation);

      const sampleOrigin =
        hit.point.clone()
          .add(sampleOffset)
          .addScaledVector(normal, maxSize);

      raycaster.set(
        sampleOrigin,
        sampleDirection
      );

      raycaster.near = 0;
      raycaster.far = maxSize * 2;

      const sampleHit =
        raycaster.intersectObjects(
          characterMeshes,
          false
        ).find(
          (candidate) =>
            candidate.point.y >= headMinY
        );

      if (sampleHit) {

        const rise =
          sampleHit.point.clone()
            .sub(hit.point)
            .dot(normal);

        surfaceRise = Math.max(
          surfaceRise,
          rise
        );

      }

    }

  }

  return surfaceRise;

}


// ========================================
// ★ 顔パーツ共通の読み込み処理
// ========================================

function loadFacePart(
  partName,
  xSliderId,
  ySliderId,
  depthSliderId,
  rotationSliderId
) {

  const settings = partSettings[partName];

  loader.load(

    settings.path,

    (gltf) => {

      const part = gltf.scene;


      // ========================================
      // パーツのサイズを調整
      // ========================================

      const originalBox =
        new THREE.Box3().setFromObject(part);

      const originalSize =
        originalBox.getSize(new THREE.Vector3());

      const maxPartSize = Math.max(
        originalSize.x,
        originalSize.y,
        originalSize.z
      );

      if (maxPartSize <= 0) {

        message.textContent =
          `${partName}の大きさを取得できませんでした`;

        return;

      }

      const targetSize =
        headRadius * settings.sizeMultiplier;

      const scale =
        targetSize / maxPartSize;

      part.scale.multiplyScalar(scale);


      // ========================================
      // パーツの中心を原点にする
      // ========================================

      const scaledBox =
        new THREE.Box3().setFromObject(part);

      const partCenter =
        scaledBox.getCenter(new THREE.Vector3());

      const scaledSize =
        scaledBox.getSize(new THREE.Vector3());

      part.position.sub(partCenter);


      // ========================================
      // 配置用グループ
      // ========================================

      const partGroup = new THREE.Group();

      partGroup.add(part);

      scene.add(partGroup);

      partGroup.visible = false;


      // ========================================
      // パーツの厚み
      // ========================================

      partGroup.updateMatrixWorld(true);

      const centeredBox =
        new THREE.Box3().setFromObject(partGroup);

      const rearDepth = Math.max(
        0,
        -centeredBox.min.z
      );

      const halfWidth =
        scaledSize.x * 0.5;

      const halfHeight =
        scaledSize.y * 0.5;


      // ========================================
      // スライダー取得
      // ========================================

      const xSlider =
        document.getElementById(xSliderId);

      const ySlider =
        document.getElementById(ySliderId);

      const depthSlider = depthSliderId
        ? document.getElementById(depthSliderId)
        : null;


      const rotationSlider = document.getElementById(rotationSliderId);
      const state = { x: Number(xSlider.value), y: Number(ySlider.value), rotation: 0 };

      function syncControls() {
        xSlider.value = String(state.x);
        ySlider.value = String(state.y);
        rotationSlider.value = String(state.rotation);
        document.getElementById(xSliderId + 'Value').textContent = state.x.toFixed(2);
        document.getElementById(ySliderId + 'Value').textContent = state.y.toFixed(2);
        document.getElementById(rotationSliderId + 'Value').textContent =
          String(Number(state.rotation.toFixed(2)));
      }

      // ========================================
      // ★ 位置・回転・埋め込み量を更新
      // ========================================

      function updatePartPosition(x, y, rotationDeg = state.rotation, depth = 0) {

        if (
          ![x, y, rotationDeg, depth].every(Number.isFinite)
        ) {
          return false;
        }

        refreshCharacterMatrices();


        // --------------------------------
        // 実際の頭の表面を探す
        // --------------------------------

        const hit = findHeadSurface(

          headCenter.x + headRadius * x,

          headCenter.y + headRadius * y

        );

        if (!hit) {

          message.textContent =
            `${partName}：指定位置に頭の表面がありません`;

          return false;

        }


        // --------------------------------
        // 表面の向きを取得
        // --------------------------------

        const normal = getSurfaceNormal(hit);

        if (!normal) {
          return false;
        }

        const orientation =
          new THREE.Quaternion()
            .setFromUnitVectors(
              forward,
              normal
            );


        // --------------------------------
        // 曲面による埋まり込みを補正
        // --------------------------------

        const surfaceRise =
          calculateSurfaceRise(
            hit,
            normal,
            orientation,
            halfWidth,
            halfHeight
          );

        const clearance = maxSize * 0.001;

        const minimumOffset =
          rearDepth +
          surfaceRise +
          clearance;


        // --------------------------------
        // パーツごとの埋め込み量
        // --------------------------------

        const actualDepth =
          settings.fixedDepth !== null
            ? settings.fixedDepth
            : depth;

        const offset =
          minimumOffset +
          headRadius * actualDepth;


        // --------------------------------
        // 位置と向きを反映
        // --------------------------------

        partGroup.position
          .copy(hit.point)
          .addScaledVector(
            normal,
            offset
          );

        // 曲面補正は0°の向きで計算し、角度だけで取り付け位置が動くのを防ぐ。
        // qSurface * qLocalZ: ローカル+Zは合成後も頭の表面法線に一致する。
        // 正の角度は正面から見て反時計回り。ArUcoの度数をそのまま使える。
        const rotation = rotationDeg >= -180 && rotationDeg <= 180
          ? rotationDeg
          : ((rotationDeg % 360 + 540) % 360) - 180;
        const localRotation = new THREE.Quaternion().setFromAxisAngle(
          forward,
          THREE.MathUtils.degToRad(rotation)
        );
        partGroup.quaternion.copy(orientation).multiply(localRotation);

        Object.assign(state, { x, y, rotation });
        facePartStates[partName] = state;
        syncControls();

        partGroup.visible = true;

        return true;

      }


      // ========================================
      // スライダーの値を反映
      // ========================================

      function updateFromSliders(event) {

        // 外部入力後も、触っていない座標・角度はそのまま保持する。
        const x = !event || event.target === xSlider ? Number(xSlider.value) : state.x;
        const y = !event || event.target === ySlider ? Number(ySlider.value) : state.y;
        const rotation = !event || event.target === rotationSlider
          ? Number(rotationSlider.value) : state.rotation;

        const depth =
          settings.fixedDepth !== null
            ? settings.fixedDepth
            : Number(depthSlider?.value ?? 0);


        // --------------------------------
        // 数値表示
        // --------------------------------

        document.getElementById(
          xSliderId + 'Value'
        ).textContent = x.toFixed(2);

        document.getElementById(
          ySliderId + 'Value'
        ).textContent = y.toFixed(2);

        if (depthSliderId) {

          document.getElementById(
            depthSliderId + 'Value'
          ).textContent = depth.toFixed(2);

        }


        const placed = updatePartPosition(x, y, rotation, depth);
        if (!placed && facePartStates[partName]) syncControls();
        return placed;

      }


      // ========================================
      // スライダーイベント
      // ========================================

      xSlider.addEventListener(
        'input',
        updateFromSliders
      );

      ySlider.addEventListener(
        'input',
        updateFromSliders
      );

      rotationSlider.addEventListener('input', updateFromSliders);

      if (depthSlider) {

        depthSlider.addEventListener(
          'input',
          updateFromSliders
        );

      }


      // ========================================
      // 外部入力（将来のArUco用）
      // ========================================

      if (partName === 'eye_01') {

        window.setEye01Coordinates = (x, y, rotationDeg = state.rotation) =>
          updatePartPosition(x, y, rotationDeg);
        // 従来名も維持する。第3引数はこれから度数法の回転角度。
        window.setEyeCoordinates = window.setEye01Coordinates;

      }

      if (partName === 'eye_02') {

        // 計測側で座標変換後に呼ぶ。例: setEye02Coordinates(0.4, 0.1, -15)
        window.setEye02Coordinates = (x, y, rotationDeg = state.rotation) =>
          updatePartPosition(x, y, rotationDeg);

      }

      if (partName === 'mouth_01') {

        window.setMouthCoordinates = (x, y, rotationDeg = state.rotation) =>
          updatePartPosition(x, y, rotationDeg);

      }


      // ========================================
      // 初期配置
      // ========================================

      // 計測済み座標の仮データも、手動操作と同じ配置処理へ渡す。
      if (settings.initialCoordinates) {
        xSlider.value = String(settings.initialCoordinates.x);
        ySlider.value = String(settings.initialCoordinates.y);
      }

      const placed = updateFromSliders();

      if (placed) {
        message.textContent = `${partName}を読み込みました！`;
      }

    },

    undefined,

    (error) => {

      console.error(error);

      message.textContent =
        `${partName}の読み込みに失敗しました`;

    }

  );

}


// ========================================
// ウィンドウサイズ変更
// ========================================

window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});


// ========================================
// 描画
// ========================================

function animate() {

  requestAnimationFrame(animate);

  applyPendingArucoMarkers();

  controls.update();

  renderer.render(scene, camera);

}

animate();

</script>

</body>
